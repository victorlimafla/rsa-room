<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>RSA Room</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=STIX+Two+Text:ital,wght@1,400;1,600&display=swap">
<style>
/* Layout: sala de aula projetada — barra com PIN no topo; colunas "derivação das chaves" | "projeção ao vivo".
   Cor codifica a chave: verde-petróleo = pública (e, n), framboesa = privada (d), âmbar = texto claro (m). */
:root {
  --paper: #EDF1F5;
  --surface: #FFFFFF;
  --sunk: #E2E8EF;
  --ink: #0F1A2C;
  --muted: #55617A;
  --line: #CDD5E0;
  --pub: #06727C;
  --pub-soft: #D4ECEE;
  --priv: #AE1F58;
  --priv-soft: #F6DAE5;
  --plain: #8F5E00;
  --plain-soft: #F7E9C6;
  --ok: #1D7337;
  --warn: #9A5300;
  --on-color: #FFFFFF;
  --hacker: #2B3548;
  --phi: #5A3FD1;
  --scroll: rgba(15, 26, 44, 0.22);
  --scroll-hover: rgba(15, 26, 44, 0.4);
  --phi-soft: #E7E1FB;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-math: "STIX Two Text", "Cambria Math", "Cambria", "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C111C; --surface: #141B2A; --sunk: #1C2436; --ink: #E6EAF2; --muted: #9AA4B8; --line: #283246;
    --pub: #45C2CC; --pub-soft: #10343A; --priv: #F2689F; --priv-soft: #3C1528; --plain: #E9B43F; --plain-soft: #352910;
    --ok: #5CCB7E; --warn: #F0A64B; --on-color: #08101C; --hacker: #3A465E; --phi: #AE9BFF; --scroll: rgba(255, 255, 255, 0.2); --scroll-hover: rgba(255, 255, 255, 0.35); --phi-soft: #2A2352; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C111C; --surface: #141B2A; --sunk: #1C2436; --ink: #E6EAF2; --muted: #9AA4B8; --line: #283246;
  --pub: #45C2CC; --pub-soft: #10343A; --priv: #F2689F; --priv-soft: #3C1528; --plain: #E9B43F; --plain-soft: #352910;
  --ok: #5CCB7E; --warn: #F0A64B; --on-color: #08101C; --hacker: #3A465E; --phi: #AE9BFF; --scroll: rgba(255, 255, 255, 0.2); --scroll-hover: rgba(255, 255, 255, 0.35); --phi-soft: #2A2352; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pub); outline-offset: 2px; }

.mv { font-family: var(--f-math); font-style: italic; font-size: 1.12em; letter-spacing: 0.01em; padding-inline: 0.03em; }
sup, sub { line-height: 0; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; font-size: 0.93em; }
.num.pub { color: var(--pub); font-weight: 600; }
.num.priv { color: var(--priv); font-weight: 600; }
.num-g { font-size: clamp(1.3rem, 3.2vw, 2rem); line-height: 1.15; }

.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap.estreito { max-width: 760px; }
.wrap.largo { max-width: 1480px; }

/* ---------- Barra superior ---------- */
.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.barra-in { max-width: 1480px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.voltar { border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 50%; font-size: 1.1rem; line-height: 1; }
.voltar:hover { background: var(--sunk); }
.marca { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; white-space: nowrap; }
.marca-sala { color: var(--ink); }
.marca-rsa { color: var(--surface); background: var(--ink); padding: 0 0.28em; border-radius: 4px; }
.barra-titulo { font-weight: 600; color: var(--muted); }
.barra-dir { margin-left: auto; }
.pin-mini { font-family: var(--f-mono); font-size: 0.9rem; color: var(--muted); }
.pin-mini b { color: var(--ink); letter-spacing: 0.08em; }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip .ponto { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.st-room { color: var(--ok); }
.chip.st-tabs { color: var(--warn); }
.chip.st-local { color: var(--pub); }
.chip.st-connecting .ponto { animation: pulsar 1s infinite; }
.chip.ok-chip { color: var(--ok); }
.chip.aviso-chip { color: var(--warn); }

/* ---------- Botões ---------- */
.btn { border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 600; background: var(--ink); color: var(--surface); }
.btn:hover { filter: brightness(1.12); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
.btn-pub { background: var(--pub); color: var(--on-color); }
.btn-priv { background: var(--priv); color: var(--on-color); }
.btn-sec { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn-sec:hover { background: var(--sunk); filter: none; }
.btn-link { border: 0; background: none; padding: 0; color: var(--pub); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; font-size: 0.88rem; }

.erro { margin: 10px 0 0; padding: 8px 12px; border-radius: 8px; background: var(--priv-soft); color: var(--priv); font-weight: 500; font-size: 0.9rem; }
.aviso { margin: 4px 0 8px; color: var(--warn); font-size: 0.88rem; }
.passo-n { color: var(--muted); font-size: 0.86rem; margin: 2px 0 0; }

/* ---------- Painéis ---------- */
.painel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.painel-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.segmentado, .abas { display: inline-flex; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 2px; }
.segmentado button, .abas button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 0.86rem; color: var(--muted); }
.segmentado button.on, .abas button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(15, 26, 44, 0.12); }

/* ---------- Anfitrião ---------- */
.host { container-type: inline-size; }
.host-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 18px; align-items: start; }
@container (max-width: 860px) { .host-grid { grid-template-columns: minmax(0, 1fr); } }

.presets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.presets .btn-sec { grid-column: 1 / -1; justify-self: start; padding: 7px 14px; font-size: 0.88rem; }
.preset { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; }
.preset b { font-family: var(--f-display); font-weight: 700; }
.preset small { color: var(--muted); font-size: 0.74rem; line-height: 1.3; }
.preset:hover { background: var(--sunk); }
.preset.on { border-color: var(--pub); box-shadow: inset 0 0 0 1px var(--pub); }
@media (max-width: 560px) { .presets { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.manual { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.manual label { display: flex; align-items: center; gap: 6px; flex: 1 1 120px; min-width: 0; }
.manual input, .campo input, textarea { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 10px; font-family: var(--f-mono); }
.manual input:focus, .campo input:focus, textarea:focus { outline: 2px solid var(--pub); outline-offset: 0; border-color: transparent; }

.passos { list-style: none; counter-reset: passo; padding: 0; margin: 18px 0 0; display: grid; gap: 0; }
.passos > li { counter-increment: passo; position: relative; padding: 12px 0 12px 40px; border-top: 1px solid var(--line); min-width: 0; }
.passos > li::before { content: counter(passo); position: absolute; left: 0; top: 12px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 0.85rem; background: var(--sunk); color: var(--muted); }
.passo-t { font-weight: 600; }
.passo-v { margin-top: 2px; font-size: 1.02rem; overflow-wrap: anywhere; }
.passo-v .sep { color: var(--muted); margin-inline: 6px; }
.oculto { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 6px; padding: 8px 12px; border-radius: 8px; background: var(--priv-soft); color: var(--priv); }
.oculto > span:first-child { font-family: var(--f-mono); font-weight: 600; }

.euclides { margin: 8px 0; }
.euclides summary { cursor: pointer; font-weight: 600; font-size: 0.9rem; color: var(--ink); }
.tabela-rolagem { overflow-x: auto; max-height: 320px; overflow-y: auto; margin: 8px 0; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; font-family: var(--f-mono); font-size: 0.82rem; font-variant-numeric: tabular-nums; width: 100%; }
th, td { padding: 5px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-family: var(--f-body); font-weight: 600; color: var(--muted); background: var(--sunk); position: sticky; top: 0; }
tr.alvo td { background: var(--priv-soft); color: var(--priv); font-weight: 600; }

.chaves-par { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 6px; }
@container (max-width: 520px) { .chaves-par { grid-template-columns: minmax(0, 1fr); } }
.cartao-chave { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 10px; min-width: 0; }
.cartao-chave.pub { background: var(--pub-soft); color: var(--pub); }
.cartao-chave.priv { background: var(--priv-soft); color: var(--priv); }
.ck-rot { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.ck-val { font-family: var(--f-mono); font-weight: 600; overflow-wrap: anywhere; color: var(--ink); }
.cartao-chave .ck-val .mv { color: inherit; }
.ck-nota { font-size: 0.82rem; color: var(--muted); }

.seguranca { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.seg-cab { display: flex; justify-content: space-between; gap: 8px; font-size: 0.86rem; font-weight: 600; }
.seg-cab b { font-family: var(--f-mono); }
.seg-trilho { height: 10px; border-radius: 999px; background: var(--sunk); margin: 6px 0; overflow: hidden; }
.seg-barra { height: 100%; border-radius: 999px; background: var(--priv); transition: width 0.6s ease; }

/* Projeção */
.projecao { display: flex; flex-direction: column; gap: 16px; }
.pin-bloco { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 18px 20px; border-radius: 12px; background: var(--ink); color: var(--surface); }
.pin-rot { font-size: 0.74rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.75; }
.pin-num { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.6rem, 8vw, 4.4rem); line-height: 1; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
.pin-esp { display: inline-block; width: 0.3em; }
.pin-instr { font-size: 0.9rem; opacity: 0.85; margin-top: 6px; }
.proj-chave { display: flex; flex-direction: column; gap: 8px; color: var(--pub); padding: 18px 20px; border-radius: 12px; background: var(--pub-soft); }
.proj-chave .proj-par { padding: 10px 14px; border-radius: 10px; background: var(--surface); }
.proj-par { display: grid; gap: 4px; color: var(--ink); }
.proj-var { font-size: 1.3rem; color: var(--pub); }
.formula { color: var(--muted); font-size: 1rem; }
.formula.grande { font-size: 1.4rem; color: var(--ink); }

.participantes h2, .feed-cab h2 { display: flex; align-items: center; gap: 8px; }
.contagem { font-family: var(--f-mono); font-size: 0.8rem; background: var(--sunk); color: var(--muted); border-radius: 999px; padding: 1px 9px; }
.nomes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.nome { padding: 4px 12px; border-radius: 999px; background: var(--pub-soft); color: var(--pub); font-weight: 600; font-size: 0.88rem; animation: entrar 0.35s ease both; }
.vazio { color: var(--muted); font-size: 0.9rem; margin: 6px 0 0; }

.feed-cab { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 14px; border-top: 1px solid var(--line); }
.alternar { display: inline-flex; align-items: center; gap: 6px; font-size: 0.86rem; font-weight: 500; color: var(--muted); cursor: pointer; }
.alternar input { accent-color: var(--priv); width: 16px; height: 16px; }
.feed { display: flex; flex-direction: column; gap: 10px; }
.vazio-feed { padding: 22px 16px; border: 1px dashed var(--line); border-radius: 10px; text-align: center; }
.vazio-feed p { color: var(--muted); margin: 8px auto 0; max-width: 40ch; font-size: 0.9rem; }

.msg { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); min-width: 0; animation: entrar 0.35s ease both; }
.msg-cab { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.msg-nick { font-family: var(--f-display); font-weight: 700; }
.msg-meta { color: var(--muted); font-size: 0.8rem; font-family: var(--f-mono); }
.blocos { width: auto; }
.blocos th { position: static; text-align: left; background: transparent; padding-left: 4px; }
.blocos td { color: var(--muted); }
.blocos .linha-m td { color: var(--muted); }
.blocos .linha-m td.rev { color: var(--plain); font-weight: 600; background: var(--plain-soft); animation: virar 0.3s ease both; }
.blocos td.mais { color: var(--muted); font-style: italic; }
.msg .tabela-rolagem { max-height: none; }
.claro { margin: 8px 0 0; font-size: 1.25rem; font-weight: 600; color: var(--muted); overflow-wrap: anywhere; min-height: 1.6em; }
.claro.visivel { color: var(--plain); font-family: var(--f-display); animation: surgir 0.4s ease both; }
.msg .btn { margin-top: 6px; }

/* ---------- Participante ---------- */
.entrada { display: flex; flex-direction: column; gap: 14px; max-width: 460px; margin: 24px auto 0; }
.campo { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 0.88rem; }
.in-pin { font-family: var(--f-display) !important; font-weight: 800; font-size: 2rem !important; letter-spacing: 0.25em; text-align: center; }
.part { display: flex; flex-direction: column; gap: 14px; }
.part-cab { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 0.92rem; color: var(--muted); }
.part-cab b { color: var(--ink); }
.part-grid { display: flex; flex-direction: column; gap: 14px; }
.aguardando { text-align: center; padding: 32px 18px; }
.aguardando p { margin: 4px 0; }
.pontinhos { display: inline-flex; gap: 6px; margin-bottom: 8px; }
.pontinhos span { width: 10px; height: 10px; border-radius: 50%; background: var(--pub); animation: pulsar 1.2s infinite; }
.pontinhos span:nth-child(2) { animation-delay: 0.2s; }
.pontinhos span:nth-child(3) { animation-delay: 0.4s; }

.compor { display: flex; flex-direction: column; gap: 8px; }
.compor-rot { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; }
textarea { font-family: var(--f-body); font-size: 1.05rem; resize: vertical; line-height: 1.45; }
.compor-rodape { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

.pipeline { display: flex; flex-direction: column; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 16px 10px; min-width: 0; }
.etapa { padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.etapa-t { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.fichas { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.ficha { font-family: var(--f-mono); font-size: 0.78rem; padding: 2px 7px; border-radius: 6px; background: var(--sunk); color: var(--ink); overflow-wrap: anywhere; max-width: 100%; font-variant-numeric: tabular-nums; }
.ficha.plain { background: var(--plain-soft); color: var(--plain); }
.ficha.pub { background: var(--pub-soft); color: var(--pub); }
.ficha.mais { background: transparent; color: var(--muted); font-style: italic; }
.dica { text-align: center; padding: 6px 0; }

.enviadas { display: flex; flex-direction: column; gap: 10px; }
.enviada { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.enviada-cab { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.claro-p { color: var(--plain); font-weight: 600; overflow-wrap: anywhere; min-width: 0; }

/* ---------- Ensaio ---------- */
.intro-ensaio { margin: 0 0 14px; color: var(--muted); max-width: 70ch; }
.ensaio-grid { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1080px) { .ensaio-grid { grid-template-columns: minmax(0, 1fr); } }
.rotulo-painel { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 0.74rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.lado-part { min-width: 0; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 76px; }
@media (max-width: 1080px) { .lado-part { position: static; } }
.lado-part .abas { align-self: flex-start; }

/* ---------- Início ---------- */
.inicio { display: flex; flex-direction: column; gap: 28px; padding-top: 40px; }
.hero { display: flex; flex-direction: column; gap: 12px; }
.grande-marca { font-size: clamp(2.8rem, 9vw, 5.2rem); line-height: 1; letter-spacing: -0.035em; }
.grande-marca .marca-rsa { border-radius: 8px; padding: 0 0.18em; }
.hero-sub { font-size: 1.12rem; max-width: 62ch; margin: 0; color: var(--muted); }
.hero-sub .mv { color: var(--ink); }

.papeis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 820px) { .papeis { grid-template-columns: minmax(0, 1fr); } }
.papel { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; border: 0; border-radius: 16px; padding: 20px 22px 18px; color: var(--on-color); min-width: 0; transition: transform 0.15s ease; }
button.papel:hover { transform: translateY(-3px); }
.papel-host { background: var(--priv); }
.papel-part { background: var(--pub); }
.papel-hacker { background: var(--hacker); color: #E6EAF2; opacity: 0.9; }
.papel-glifo { font-size: clamp(3rem, 7vw, 4.6rem); line-height: 1; margin-bottom: 4px; }
.papel-hacker .papel-glifo { font-size: clamp(1.8rem, 4vw, 2.4rem); line-height: 1.6; }
.papel-glifo .mv { font-weight: 600; }
.papel-nome { font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; letter-spacing: -0.01em; }
.papel-desc { font-size: 0.92rem; opacity: 0.92; }
.papel-cta { margin-top: auto; padding-top: 10px; font-weight: 700; font-size: 0.92rem; }

.ensaio-chamada { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 16px 20px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.ensaio-chamada p { margin: 2px 0 0; }

.exemplo { padding-top: 6px; }
.exemplo h2 { font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-family: var(--f-body); font-weight: 600; margin-bottom: 10px; }
.exemplo-linha { display: flex; flex-wrap: wrap; gap: 8px 22px; font-family: var(--f-mono); font-size: 1.05rem; }
.pub-t { color: var(--pub); font-weight: 600; }
.priv-t { color: var(--priv); font-weight: 600; }
.exemplo .passo-n { margin-top: 10px; max-width: 80ch; }

.carregando { padding: 40px 16px; text-align: center; color: var(--muted); }
.link-direto { margin-top: 12px; padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--surface) 25%, transparent); width: 100%; min-width: 0; }
.link-linha { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; min-width: 0; }
.link-linha code { font-family: var(--f-mono); font-size: 0.86rem; overflow-wrap: anywhere; min-width: 0; flex: 1 1 220px; user-select: all; }
.btn-copiar { border: 1px solid color-mix(in srgb, var(--surface) 50%, transparent); background: transparent; color: var(--surface); border-radius: 8px; padding: 4px 12px; font-weight: 600; font-size: 0.82rem; }
.btn-copiar:hover { background: color-mix(in srgb, var(--surface) 15%, transparent); }
.falha { margin-top: 32px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.falha pre { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--priv-soft); color: var(--priv); font-family: var(--f-mono); font-size: 0.82rem; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 100%; }

/* ---------- Euclides estendido: modo didático ---------- */
/* φ(n) em violeta, e em verde-petróleo: os coeficientes viajam junto com a cor do símbolo. */
.modo-euclides { flex-wrap: wrap; margin: 10px 0 4px; }
.didatico { display: flex; flex-direction: column; }
.fase { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); min-width: 0; }
.fase h4 { font-family: var(--f-display); font-size: 1rem; font-weight: 700; margin: 0 0 4px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; text-wrap: balance; }
.fase-num { font-family: var(--f-body); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--ink); color: var(--surface); }
.sym { font-weight: 600; white-space: nowrap; }
.sym-phi { color: var(--phi); }
.sym-e { color: var(--pub); }
.eq { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 5px; font-family: var(--f-mono); font-size: 0.9rem; font-variant-numeric: tabular-nums; min-width: 0; }
.eq .op { color: var(--muted); padding-inline: 1px; }
.termo { display: inline-flex; align-items: baseline; gap: 1px; padding: 0 6px; border-radius: 6px; font-weight: 600; overflow-wrap: anywhere; max-width: 100%; }
.termo-phi { color: var(--phi); background: var(--phi-soft); }
.termo-e { color: var(--pub); background: var(--pub-soft); }
.termo .sym { color: inherit; }
.resto { font-family: var(--f-body); font-weight: 600; font-size: 0.86em; padding: 0 7px; border-radius: 6px; background: var(--sunk); border: 1px solid var(--line); white-space: nowrap; }
.par { color: var(--muted); font-size: 1.1em; }
.coef { font-weight: 600; }
.um { font-weight: 700; }
.ida, .voltas { list-style: none; margin: 8px 0 0; padding: 0; }
.ida > li { display: flex; flex-direction: column; gap: 3px; padding: 8px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.ida > li:last-child { border-bottom: 0; }
.div-num { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; }
.volta { padding: 12px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.volta:last-child { border-bottom: 0; }
.volta-t { display: block; font-weight: 700; margin-bottom: 6px; }
.volta-sub { color: var(--muted); font-weight: 500; }
.eq-bloco { display: flex; flex-direction: column; gap: 6px; }
.eq-bloco .eq { position: relative; padding-left: 112px; }
.eq-rot { position: absolute; left: 0; top: 0.25em; width: 104px; font-family: var(--f-body); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.eq-final { padding-block: 6px; border-radius: 8px; background: var(--sunk); }
.eq-bloco .eq-final { padding-right: 8px; }
.eq-final .eq-rot { top: calc(6px + 0.25em); left: 8px; }
.bezout .eq-final { box-shadow: inset 0 0 0 1px var(--priv); }
.lacuna { text-align: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.eq-destaque { margin: 6px 0 4px; padding: 8px 10px; border-radius: 8px; background: var(--sunk); font-size: 1rem; }
.ajuste { margin: 6px 0 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 10px; }
.ajuste > li > span { display: block; margin-bottom: 4px; }
.ajuste .termo { font-size: 0.95em; }
.seta { color: var(--muted); }
.mod { color: var(--muted); font-family: var(--f-body); }
.d-sym { color: var(--priv); font-weight: 700; }
.d-val { color: var(--priv); background: var(--priv-soft); font-weight: 700; padding: 0 7px; border-radius: 6px; }
@container (max-width: 560px) {
  .eq-bloco .eq { padding-left: 0; }
  .eq-rot { position: static; width: 100%; }
  .eq-final { padding-inline: 8px; }
}

/* ---------- φ(n) com valor, contexto e teoria de e ---------- */
.phi-n { font-family: var(--f-mono); font-style: normal; font-size: 0.86em; }
.contexto { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 10px 0 4px; padding: 8px 12px; border-radius: 8px; background: var(--sunk); font-family: var(--f-mono); font-size: 0.86rem; min-width: 0; overflow-wrap: anywhere; }
.ctx-rot { font-family: var(--f-body); font-size: 0.68rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.ctx-sep { color: var(--line); }
.ctx-nota { flex-basis: 100%; font-family: var(--f-body); font-size: 0.8rem; color: var(--muted); }
.teoria { margin-top: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); min-width: 0; }
.teoria summary { cursor: pointer; font-weight: 600; font-size: 0.9rem; }
.teoria-corpo { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.teoria-item p { margin: 3px 0 0; font-size: 0.88rem; max-width: 68ch; }
.teoria-rot { display: block; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.teoria-eq { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 4px; margin-top: 4px; padding: 5px 10px; border-radius: 6px; background: var(--pub-soft); font-family: var(--f-mono); font-size: 0.92rem; max-width: 100%; overflow-wrap: anywhere; }
.e-tal { font-family: var(--f-body); color: var(--muted); padding-inline: 4px; }
.teoria-acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.teoria-acoes .btn { padding: 6px 12px; font-size: 0.86rem; }
.bin { font-family: var(--f-mono); font-size: 0.86em; background: var(--sunk); padding: 0 5px; border-radius: 4px; overflow-wrap: anywhere; }
.teoria-atual { color: var(--muted); }

/* ---------- Caracteres sobre os blocos ---------- */
.blocos .linha-txt th { color: var(--muted); font-size: 0.72rem; }
.blocos .linha-txt td { text-align: center; font-family: var(--f-display); font-size: 1rem; color: var(--muted); }
.blocos .linha-txt td.rev { color: var(--plain); font-weight: 700; animation: virar 0.3s ease both; }
.blocos .linha-txt td.multi.rev { background: var(--plain-soft); box-shadow: inset 0 -2px 0 var(--plain); }
.mapa-utf8 { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; min-width: 0; }
.gc { display: inline-flex; flex-direction: column; align-items: center; gap: 3px; padding: 3px 4px; border-radius: 7px; }
.gc-char { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; line-height: 1.2; color: var(--plain); }
.gc-bytes { display: flex; gap: 3px; }
.gc-multi { background: var(--plain-soft); box-shadow: inset 0 0 0 1.5px var(--plain); padding-inline: 6px; }
.gc-multi .ficha { background: var(--surface); }
.gc-tag { font-size: 0.66rem; font-weight: 600; color: var(--plain); white-space: nowrap; }
.ficha-btn { border: 1px solid transparent; font: inherit; font-family: var(--f-mono); font-size: 0.78rem; cursor: pointer; }
.ficha-btn:hover { border-color: var(--plain); }
.ficha.plain.sel { background: var(--plain); color: var(--on-color); }
.ficha.pub.sel { background: var(--pub); color: var(--on-color); }
.sm-valores { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 8px 0 2px; font-family: var(--f-mono); font-size: 0.88rem; overflow-wrap: anywhere; }
.v-plain { color: var(--plain); }
.v-pub { color: var(--pub); }

/* ---------- Confirmação de envio ---------- */
.btn-enviar { min-width: 9.5em; display: inline-flex; justify-content: center; align-items: center; transition: background-color 0.2s ease; }
.btn-enviar.enviado { background: var(--ok); color: var(--on-color); }
.enviado-conteudo { display: inline-flex; align-items: center; gap: 6px; animation: pop 0.35s ease both; }
.check path { stroke-dasharray: 20; stroke-dashoffset: 20; animation: tracar 0.35s 0.1s ease forwards; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
@keyframes pop { 0% { transform: scale(0.85); opacity: 0.3; } 60% { transform: scale(1.06); } 100% { transform: none; opacity: 1; } }
@keyframes tracar { to { stroke-dashoffset: 0; } }

/* ---------- Painel de chaves: p, q e e ---------- */
.manual-bloco { display: flex; flex-direction: column; gap: 10px; }
.ajuda-pq { padding: 10px 14px; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); font-size: 0.88rem; }
.ajuda-pq ul { margin: 6px 0 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 3px; }
.campo-primo { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 2px 8px; flex: 1 1 160px; min-width: 0; }
.cp-nome { grid-row: 1; }
.cp-st { grid-column: 2; font-size: 0.78rem; font-weight: 600; min-height: 1.2em; color: var(--muted); }
.cp-st.primo { color: var(--ok); }
.cp-st.composto, .cp-st.formato { color: var(--priv); }
.manual { align-items: flex-start; }
.manual .btn { align-self: flex-start; }
.editor-e { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.editor-linha { display: flex; align-items: center; gap: 8px; }
.editor-rot { font-size: 1.15rem; }
.in-e { font-family: var(--f-mono); font-size: 1.05rem; font-weight: 600; color: var(--pub); width: min(100%, 16em); border: 2px solid var(--line); background: var(--paper); border-radius: 8px; padding: 6px 10px; }
.in-e.ok { border-color: var(--ok); }
.in-e.erro { border-color: var(--priv); color: var(--priv); }
.in-e:focus { outline: 2px solid var(--pub); outline-offset: 1px; }
.e-ok { margin: 0; font-size: 0.86rem; color: var(--ok); font-weight: 500; }
.e-erro { margin: 0; padding: 8px 12px; border-radius: 8px; background: var(--priv-soft); color: var(--priv); font-size: 0.88rem; }
.atalhos-e { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 2px; }
.atalhos-e .btn { padding: 6px 12px; font-size: 0.86rem; }
.atalhos-rot { font-size: 0.78rem; color: var(--muted); margin-left: 4px; }
.chip-e { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-family: var(--f-mono); font-size: 0.84rem; color: var(--pub); }
.chip-e:hover { border-color: var(--pub); }
.chip-e.on { background: var(--pub); border-color: var(--pub); color: var(--on-color); }
.chip-e small { font-family: var(--f-body); font-size: 0.7rem; opacity: 0.8; }
.aviso-via { margin: 10px 0 0; padding: 8px 12px; border-radius: 8px; border: 1px dashed var(--muted); background: var(--sunk); font-size: 0.85rem; color: var(--muted); }
.aviso-via b { color: var(--ink); }

/* ---------- Interceptador ---------- */
.btn-hacker { background: var(--hacker); color: #E6EAF2; }
.painel-hacker { border-color: var(--hacker); }
.interceptado { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 10px; background: var(--sunk); border: 1px dashed var(--muted); min-width: 0; }
.interceptado .ck-rot { color: var(--muted); }
.int-chave { font-family: var(--f-mono); font-weight: 600; color: var(--pub); overflow-wrap: anywhere; }
.ataque { display: flex; flex-direction: column; gap: 10px; }
.ataque-opcoes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ataque-opcoes .segmentado { flex-wrap: wrap; }
.segmentado button:disabled { opacity: 0.45; cursor: not-allowed; }
.ataque-sel { display: inline-flex; align-items: center; gap: 6px; font-size: 0.86rem; font-weight: 500; color: var(--muted); }
.ataque-sel select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
.ataque-acoes { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.cronometro { font-family: var(--f-display); font-weight: 800; font-size: 1.8rem; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.cronometro.urgente { color: var(--priv); animation: pulsar 0.8s infinite; }
.placar { display: flex; flex-direction: column; gap: 10px; }
.trilho { height: 12px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.trilho-barra { height: 100%; background: var(--hacker); border-radius: 999px; transition: width 0.15s linear; }
.trilho-barra.ok { background: var(--priv); }
.placar-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.placar-grade > div { display: flex; flex-direction: column; min-width: 0; }
.placar-grade b { font-size: 1rem; overflow-wrap: anywhere; }
.pl-rot { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.tentativas { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 8px; background: var(--sunk); font-family: var(--f-mono); font-size: 0.82rem; max-height: 220px; overflow: auto; }
.tentativa { color: var(--muted); overflow-wrap: anywhere; }
.tentativa:last-child { color: var(--ink); font-weight: 600; }
.tentativa.acerto { color: var(--priv); font-weight: 700; }
.veredito { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 10px; overflow-wrap: anywhere; }
.veredito.quebrado { background: var(--priv-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--priv); }
.veredito.quebrado > b { color: var(--priv); }
.veredito.resistiu { background: var(--pub-soft); box-shadow: inset 0 0 0 1px var(--pub); }
.veredito.resistiu > b { color: var(--pub); }
.chip.quebrado-chip { color: var(--priv); }
.lido { margin: 0; color: var(--priv); font-weight: 600; font-family: var(--f-display); font-size: 1.05rem; overflow-wrap: anywhere; }
.abas { flex-wrap: wrap; }
.abas button.aba-hacker.on { background: var(--hacker); color: #E6EAF2; }

/* ---------- Página inicial ---------- */
h1.marca { margin: 0; }
.papel-apelido { font-weight: 700; font-size: 0.95rem; opacity: 0.92; margin-top: -4px; }
.papel-emoji { font-size: clamp(2.8rem, 6vw, 3.8rem) !important; line-height: 1 !important; }
.papel-hacker { opacity: 1; }
.solo { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 18px 28px; padding: 24px 26px; border-radius: 18px; background: var(--ink); color: var(--surface); }
.solo h2 { font-size: clamp(1.3rem, 3vw, 1.7rem); font-weight: 800; color: var(--surface); }
.solo p { margin: 6px 0 0; opacity: 0.85; max-width: 52ch; }
.solo-trio { display: flex; gap: 6px; }
.trio { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 1.5rem; }
.trio .mv { font-weight: 600; }
.t-host { background: var(--priv); color: var(--on-color); }
.t-part { background: var(--pub); color: var(--on-color); }
.t-hacker { background: var(--hacker); }
.btn-solo { background: var(--surface); color: var(--ink); padding: 12px 20px; font-size: 1rem; }
@media (max-width: 760px) { .solo { grid-template-columns: minmax(0, 1fr); } .solo-trio { order: -1; } .btn-solo { justify-self: start; } }
.pratica { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 0 20px; }
.pratica summary { cursor: pointer; padding: 16px 0; font-family: var(--f-display); font-weight: 700; font-size: 1.08rem; }
.pratica-corpo { display: flex; flex-direction: column; gap: 14px; padding-bottom: 20px; }
.pratica-nota { margin: 0; font-size: 1.02rem; max-width: 70ch; }
.pratica-passos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .pratica-passos { grid-template-columns: minmax(0, 1fr); } }
.pp { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 10px; background: var(--pub-soft); }
.pp-dificil { background: var(--priv-soft); }
.pp-rot { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.pp-eq { font-family: var(--f-mono); font-size: 1.25rem; font-weight: 600; }
.pratica-sub { font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-family: var(--f-body); font-weight: 600; }

.tabela-inteira { max-height: none; overflow-y: visible; }
.tabela-inteira th { position: static; }
/* ---------- Metáfora: cadeados, chaves e caixas ---------- */
.etiqueta { display: inline-block; vertical-align: middle; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-family: var(--f-body); font-size: 0.72rem; font-weight: 600; letter-spacing: 0; text-transform: none; white-space: nowrap; }
.et-pub { background: var(--pub); color: var(--on-color); }
.et-priv { background: var(--priv); color: var(--on-color); }
.caixa-ico { display: inline-block; margin-right: 6px; }
.caixa-ico.aberta { animation: pop 0.4s ease both; }
.th-ico { font-size: 0.8em; margin-right: 3px; }
.ficha.selada { position: relative; padding: 4px 9px 4px 22px; border-radius: 4px; border: 1.5px solid var(--pub); background: linear-gradient(90deg, var(--pub-soft) 0 14px, var(--surface) 14px); box-shadow: 0 1px 0 var(--line); }
.ficha.selada::before { content: "🔒"; position: absolute; left: 2px; top: 50%; transform: translateY(-50%); font-size: 0.62rem; }
.ficha.selada.aberta { border-style: dashed; opacity: 0.8; }
.ficha.selada.aberta::before { content: "📦"; }
.ficha.selada.sel { background: var(--pub); color: var(--on-color); }
.h-sub { display: block; font-family: var(--f-body); font-weight: 500; font-size: 0.86rem; color: var(--muted); margin-top: 2px; }
.fechadura { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 12px; background: var(--sunk); border: 1px solid var(--line); }
.fe-ico { font-size: 2.2rem; line-height: 1; }
.fe-forcando .fe-ico { animation: chacoalhar 0.35s ease-in-out infinite; }
.fe-aberta .fe-ico { animation: pop 0.45s ease both; }
.fe-corpo { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.fe-pinos { display: flex; gap: 4px; align-items: flex-end; height: 26px; }
.pino { flex: 1; height: 100%; border-radius: 3px 3px 1px 1px; background: var(--hacker); opacity: 0.85; transition: height 0.25s ease, background-color 0.25s ease; }
.pino.caido { height: 30%; background: var(--priv); }
.pino.mexendo { animation: mexer 0.3s ease-in-out infinite alternate; }
.fe-aberta .pino { background: var(--priv); height: 30%; }
.fe-resistiu .pino:not(.caido) { background: var(--pub); }
.fe-rot { font-size: 0.86rem; font-weight: 600; overflow-wrap: anywhere; }
.fe-cand { font-family: var(--f-mono); font-weight: 400; color: var(--muted); }
@keyframes chacoalhar { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
@keyframes mexer { from { height: 100%; } to { height: 70%; } }

/* ---------- Cabeçalho dos cartões de chave e controles de d ---------- */
.ck-cab { display: flex; align-items: center; justify-content: space-between; gap: 4px 8px; flex-wrap: wrap; min-width: 0; }
.ck-cab .ck-rot { white-space: nowrap; flex: 0 0 auto; }
.ck-cab .etiqueta { margin-left: 0; flex: 0 0 auto; }

function modPow(b, e, m) {

    e >>= 1n;
    b = (b * b) % m;

        for (let i = 0; i < 200000; i++) {
          if (ops++ >= maxOps) break;
          if (sp * sp > RN) { st.fase = "divisao"; st.progressoCrivo = 1; break; }
          if (sm === 0) {
            if (comp[sp >> 1]) { sp += 2; continue; }
            sm = sp * sp;
          }
          comp[sm >> 1] = 1;
          st.marcados++;
          sm += 2 * sp;
          if (sm > RN) { sm = 0; sp += 2; }
        }
        if (st.fase === "crivo") { st.progressoCrivo = Math.min(1, sp / raizR); st.candidato = BigInt(sp); }
        if (ops >= maxOps) break;
      }
      return st; /* a fase de divisão começa no próximo passo, com o seu próprio limite */
    }
    if (usaNum) {
      while (agora() < fim) {
        for (let i = 0; i < 20000; i++) {
          if (ops >= maxOps) break;
          if (d > RN) { st.acabou = true; st.candidato = BigInt(d); return st; }
          st.varridos++;
          if (d === 2) { st.testes++; ops++; if (registrar) anotar(2, N % 2); if (N % 2 === 0) { achar(2n); return st; } d = 3; continue; }
          if (comp && comp[d >> 1]) { d += 2; continue; }
          st.testes++;
          ops++;
          if (registrar) anotar(d, N % d);
          if (N % d === 0) { achar(BigInt(d)); return st; }
          d += 2;
        }
        if (ops >= maxOps) break;
      }
      st.candidato = BigInt(d);
    } else {
      while (agora() < fim) {
        for (let i = 0; i < 2000; i++) {
          if (ops++ >= maxOps) break;
          if (dB > R) { st.acabou = true; st.candidato = dB; return st; }
          st.varridos++;
          st.testes++;
          const resto = n % dB;
          if (registrar) anotar(dB, resto);
          if (resto === 0n) { achar(dB); return st; }
          dB = dB === 2n ? 3n : dB + 2n;
        }
        if (ops >= maxOps) break;
      }
      st.candidato = dB;
    }
    return st;
  }
  return { passo, estado: st };
}

const popcount = (x) => x.toString(2).split("").filter((c) => c === "1").length;

/* Estimativa didática para o ataque por divisão por tentativas:
   testar os ímpares até √n, a ~2·10^7 divisões BigInt por segundo. */
function estimativaFatoracao(n) {
  const raizBits = Math.ceil(bitLen(n) / 2);
  const testesLog10 = (raizBits - 1) * Math.log10(2);
  const segundos = Math.pow(10, testesLog10 - Math.log10(2e7));
  return { testesLog10, segundos };
}

function formatarDuracao(s) {
  if (!isFinite(s)) return "tempo astronômico";
  if (s < 0.001) return "menos de 1 ms";
  if (s < 1) return `${Math.round(s * 1000)} ms`;
  if (s < 60) return `${s.toFixed(1).replace(".", ",")} s`;
  if (s < 3600) return `${Math.round(s / 60)} min`;
  if (s < 86400) return `${Math.round(s / 3600)} h`;
  if (s < 86400 * 365) return `${Math.round(s / 86400)} dias`;
  const anos = s / (86400 * 365);
  if (anos < 1e6) return `${Math.round(anos).toLocaleString("pt-BR")} anos`;
  return `10^${Math.floor(Math.log10(anos))} anos`;
}

<script>
/* ============================================================
   Interface — React 18 + htm (sintaxe próxima de JSX, sem build).
   ============================================================ */
const { useState, useEffect, useRef, useMemo } = React;
const html = htm.bind(React.createElement);

const PRESETS = [
  { id: "mini", nome: "Mini", bits: 6, nota: "p, q com 2 dígitos" },
  { id: "peq", nome: "Pequena", bits: 12, nota: "p, q com 4 dígitos" },
  { id: "med", nome: "Média", bits: 24, nota: "p, q com 8 dígitos" },
  { id: "gde", nome: "Grande", bits: 64, nota: "p, q com 19–20 dígitos" },
];

const rid = (n = 8) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");
const novoPin = () => String(100000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900000));
const reduzMovimento = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
/* soDigitos: o que o usuário digita (p, q, e: até 60 dígitos).
   numeroDaSala: o que trafega pela sala (n, e, blocos c). Como p e q têm até 60 dígitos,
   n = p·q tem até 120; um limite de 60 aqui fazia o participante ignorar chaves grandes. */
const soDigitos = (s) => /^\d{1,60}$/.test(s);
const numeroDaSala = (s) => /^\d{1,130}$/.test(s);

/* Agrupa dígitos de 3 em 3 com espaço fino, como em textos de matemática. */
function agrupar(v) {
  const s = v.toString();
  if (s.length < 5) return s;
  return s.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}

/* ============================================================
   Camada de sincronização — uma interface, três transportes.
   { kind, setPresence(obj), subscribe(cb(peers)) → unsub, close() }
   peers = [{ id, isMe, presence }]
   Para o GitHub Pages, basta criar um transporte Firebase com a mesma forma.
   ============================================================ */
function criarBarramentoLocal() {
  const salas = new Map();
  return {
    connect(pin) {
      if (!salas.has(pin)) salas.set(pin, { membros: new Map(), subs: new Set() });
      const sala = salas.get(pin);
      const id = rid();
      sala.membros.set(id, {});
      const avisar = () => sala.subs.forEach((f) => f());
      const t = {
        kind: "local",
        setPresence(p) { sala.membros.set(id, p); avisar(); },
        subscribe(cb) {
          const f = () => cb([...sala.membros].map(([pid, pr]) => ({ id: pid, isMe: pid === id, presence: pr })));
          sala.subs.add(f);
          queueMicrotask(f);
          return () => sala.subs.delete(f);
        },
        close() { sala.membros.delete(id); avisar(); },
      };
      avisar();
      return t;
    },
  };
}
const barramentoDaPagina = criarBarramentoLocal();

function transporteAbas(pin) {
  if (typeof BroadcastChannel === "undefined") return barramentoDaPagina.connect(pin);
  const canal = new BroadcastChannel("sala-rsa-" + pin);
  const id = rid();
  let minha = {};
  const outros = new Map();
  const subs = new Set();
  const retrato = () => [{ id, isMe: true, presence: minha }, ...[...outros].map(([k, v]) => ({ id: k, isMe: false, presence: v.presence }))];
  const avisar = () => { const s = retrato(); subs.forEach((f) => f(s)); };
  const postar = (m) => { try { canal.postMessage(m); } catch (_) {} };
  canal.onmessage = (ev) => {
    const m = ev.data;
    if (!m || typeof m !== "object" || m.id === id) return;
    if (m.type === "p" && m.presence && typeof m.presence === "object") {
      outros.set(m.id, { presence: m.presence, visto: Date.now() });
      avisar();
    } else if (m.type === "oi") {
      postar({ type: "p", id, presence: minha });
    } else if (m.type === "tchau") {
      outros.delete(m.id);
      avisar();
    }
  };
  postar({ type: "oi", id });
  const intervalo = setInterval(() => {
    postar({ type: "p", id, presence: minha });
    const agora = Date.now();
    let mudou = false;
    for (const [k, v] of outros) if (agora - v.visto > 7000) { outros.delete(k); mudou = true; }
    if (mudou) avisar();
  }, 2000);
  const sair = () => postar({ type: "tchau", id });
  window.addEventListener("pagehide", sair);
  return {
    kind: "tabs",
    setPresence(p) { minha = p; postar({ type: "p", id, presence: minha }); avisar(); },
    subscribe(cb) { subs.add(cb); queueMicrotask(() => cb(retrato())); return () => subs.delete(cb); },
    close() { clearInterval(intervalo); sair(); window.removeEventListener("pagehide", sair); canal.close(); },
  };
}

/* Sala em tempo real entre aparelhos, oferecida pelo visualizador do Claude. */
let promessaSala = null;
function capacidadeSala() {
  if (!promessaSala) {
    const use = window.claude && typeof window.claude.use === "function" ? window.claude.use.bind(window.claude) : null;
    promessaSala = use
      ? Promise.race([use("room").catch(() => null), new Promise((r) => setTimeout(() => r(null), 6000))])
      : Promise.resolve(null);
  }
  return promessaSala;
}

async function transporteSala(pin) {
  const room = await capacidadeSala();
  if (!room) return null;
  let r;
  try { r = await room.join("rsa-" + pin); } catch (_) { return null; }
  const subs = new Set();
  const mapear = (lista) => lista.filter((p) => p.kind === "viewer").map((p) => ({ id: p.peer, isMe: p.sameTab, presence: p.presence || {} }));
  const parar = r.onPeers((ch) => { const s = mapear(ch.peers); subs.forEach((f) => f(s)); }, () => {});
  return {
    kind: "room",
    setPresence(p) { r.presence(p).catch(() => {}); },
    subscribe(cb) { subs.add(cb); queueMicrotask(() => cb(mapear(r.peers()))); return () => subs.delete(cb); },
    close() { parar(); r.leave().catch(() => {}); },
  };
}

/* Sala em tempo real entre aparelhos via Supabase Realtime (Presence).
   Usada fora do Claude, quando o config.js traz a URL e a chave do projeto Supabase. */
let clienteSupabase = null;
function configSupabase() {
  const c = window.RSA_CONFIG || {};
  const ok = typeof c.SUPABASE_URL === "string" && /^https:\/\/\S+$/.test(c.SUPABASE_URL.trim()) &&
    typeof c.SUPABASE_KEY === "string" && c.SUPABASE_KEY.trim().length > 20 &&
    window.supabase && typeof window.supabase.createClient === "function";
  return ok ? c : null;
}

async function transporteSupabase(pin) {
  const cfg = configSupabase();
  if (!cfg) return null;
  let canal;
  const meuId = rid();
  try {
    if (!clienteSupabase) {
      clienteSupabase = window.supabase.createClient(cfg.SUPABASE_URL.trim(), cfg.SUPABASE_KEY.trim(), {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
      });
    }
    canal = clienteSupabase.channel("rsa-" + pin, { config: { presence: { key: meuId } } });
  } catch (_) { return null; }

  const subs = new Set();
  let minha = {};
  let fechado = false;
  let timer = null;

  const retrato = () => {
    const est = canal.presenceState();
    const outros = Object.keys(est).filter((k) => k !== meuId).map((k) => {
      const metas = est[k] || [];
      const ult = metas[metas.length - 1] || {};
      return { id: k, isMe: false, presence: ult.p && typeof ult.p === "object" ? ult.p : {} };
    });
    return [{ id: meuId, isMe: true, presence: minha }, ...outros];
  };
  const avisar = () => { const s = retrato(); subs.forEach((f) => f(s)); };

  /* O plano gratuito limita as mensagens de presença por segundo. Por isso, chamadas seguidas
     são juntadas em uma só e, se o envio falhar, tenta de novo com um atraso aleatório. */
  const enviar = (tentativa = 0) => {
    if (fechado) return;
    const refazer = () => {
      if (!fechado && tentativa < 4) setTimeout(() => enviar(tentativa + 1), 400 * (tentativa + 1) + Math.random() * 500);
    };
    try { Promise.resolve(canal.track({ p: minha })).then((r) => { if (r !== "ok") refazer(); }, refazer); } catch (_) { refazer(); }
  };
  const agendar = () => {
    if (timer) return;
    timer = setTimeout(() => { timer = null; enviar(); }, 150);
  };

  canal.on("presence", { event: "sync" }, avisar);
  const conectado = await new Promise((resolve) => {
    const limite = setTimeout(() => resolve(false), 8000);
    try {
      canal.subscribe((estado) => {
        if (estado === "SUBSCRIBED") {
          clearTimeout(limite);
          resolve(true);
          if (Object.keys(minha).length) enviar(); /* reconectou: reenvia o que já era meu */
        } else if (estado === "CHANNEL_ERROR" || estado === "TIMED_OUT") {
          clearTimeout(limite);
          resolve(false);
        }
      });
    } catch (_) { clearTimeout(limite); resolve(false); }
  });
  if (!conectado) {
    fechado = true;
    try { Promise.resolve(clienteSupabase.removeChannel(canal)).catch(() => {}); } catch (_) {}
    return null;
  }

  return {
    kind: "room",
    setPresence(p) { minha = p; avisar(); agendar(); },
    subscribe(cb) { subs.add(cb); queueMicrotask(() => cb(retrato())); return () => subs.delete(cb); },
    close() {
      fechado = true;
      clearTimeout(timer);
      subs.clear();
      try { Promise.resolve(clienteSupabase.removeChannel(canal)).catch(() => {}); } catch (_) {}
    },
  };
}

async function conectar(pin, barramento) {
  if (barramento) return barramento.connect(pin);
  return (await transporteSala(pin)) || (await transporteSupabase(pin)) || transporteAbas(pin);
}

const ROTULO_TRANSPORTE = {
  connecting: "Conectando…",
  room: "Tempo real entre aparelhos",
  tabs: "Abas deste navegador",
  local: "Ensaio nesta página",
};

function useTransporte(pin, barramento) {
  const [t, setT] = useState(null);
  const [status, setStatus] = useState("idle");
  useEffect(() => {
    if (!pin) return;
    let morto = false, tr = null;
    setStatus("connecting");
    conectar(pin, barramento).then((x) => {
      if (morto) { x.close(); return; }
      tr = x;
      setT(x);
      setStatus(x.kind);
    });
    return () => { morto = true; if (tr) tr.close(); setT(null); };
  }, [pin, barramento]);
  return [t, status];
}

function usePares(t) {
  const [pares, setPares] = useState([]);
  useEffect(() => (t ? t.subscribe(setPares) : undefined), [t]);
  return pares;
}

/* Mensagens recebidas são dados de terceiros: validar antes de usar. */
function mensagemValida(m) {
  return m && typeof m === "object" && typeof m.id === "string" && m.id.length <= 24 &&
    typeof m.kid === "string" && m.kid.length <= 12 && Number.isInteger(m.L) && m.L > 0 && m.L <= 600 &&
    Array.isArray(m.c) && m.c.length > 0 && m.c.length <= 600 && m.c.every((x) => typeof x === "string" && numeroDaSala(x));
}

/* ============================================================
   Cálculo de chaves em Web Worker
   O worker recebe o mesmo núcleo matemático (script #rsa-core) e responde
   { id, chave } ou { id, falha }. Sem suporte a Worker, cai para setTimeout.
   ============================================================ */
let workerChaves = null;
const pendentes = new Map();
let proximoId = 1;

function executarTarefa(t) {
  if (t.tipo === "sortear") {
    const p = primoAleatorio(t.bits);
    let q;
    do q = primoAleatorio(t.bits); while (q === p);
    return montarChave(p, q, null);
  }
  return montarChave(t.p, t.q, t.e);
}

function obterWorker() {
  if (workerChaves !== null) return workerChaves;
  workerChaves = false;
  try {
    const nucleo = document.getElementById("rsa-core");
    if (typeof Worker === "undefined" || !nucleo) return false;
    const fonte = nucleo.textContent + "\n" + executarTarefa.toString() + `
self.onmessage = (ev) => {
  const { id, tarefa } = ev.data;
  try { self.postMessage({ id, chave: executarTarefa(tarefa) }); }
  catch (e) { self.postMessage({ id, falha: String(e && e.message || e) }); }
};`;
    const url = URL.createObjectURL(new Blob([fonte], { type: "text/javascript" }));
    const w = new Worker(url);
    w.onmessage = (ev) => {
      const { id, chave, falha } = ev.data || {};
      const pend = pendentes.get(id);
      if (!pend) return;
      pendentes.delete(id);
      clearTimeout(pend.limite);
      if (falha) pend.rejeitar(new Error(falha)); else pend.resolver(chave);
    };
    w.onerror = () => {
      for (const [, pend] of pendentes) { clearTimeout(pend.limite); pend.usarFallback(); }
      pendentes.clear();
      workerChaves = false;
    };
    workerChaves = w;
  } catch (_) { workerChaves = false; }
  return workerChaves;
}

function calcularSemWorker(t) {
  return new Promise((resolver, rejeitar) => {
    /* Dois quadros de folga para o "Calculando…" aparecer antes da conta. */
    setTimeout(() => { try { resolver(executarTarefa(t)); } catch (e) { rejeitar(e); } }, 30);
  });
}

function calcularNoWorker(tarefa) {
  const w = obterWorker();
  if (!w) return calcularSemWorker(tarefa);
  return new Promise((resolver, rejeitar) => {
    const id = proximoId++;
    const pend = {
      resolver, rejeitar,
      usarFallback: () => calcularSemWorker(tarefa).then(resolver, rejeitar),
      limite: setTimeout(() => {
        pendentes.delete(id);
        rejeitar(new Error("O cálculo passou de 20 segundos e foi cancelado. Tente primos menores."));
        try { w.terminate(); } catch (_) {}
        workerChaves = null;
        for (const [, outro] of pendentes) { clearTimeout(outro.limite); outro.usarFallback(); }
        pendentes.clear();
      }, 20000),
    };
    pendentes.set(id, pend);
    w.postMessage({ id, tarefa });
  });
}

/* Alerta didático: primos grandes (acima de 100 000) separados por menos de 10 000. */
function primosProximos(p, q) {
  const dif = p > q ? p - q : q - p;
  const menor = p < q ? p : q;
  return dif < 10000n && menor > 100000n;
}

/* ============================================================
   Peças visuais
   ============================================================ */
const V = (s, cls = "") => html`<i className=${"mv " + cls}>${s}</i>`;

/* φ(n) escrito com o valor de n: φ(3599). Dentro das contas repetidas do Euclides
   (CompactoCtx), um n com mais de 12 dígitos volta a ser escrito como φ(n). */
const NCtx = React.createContext(null);
const CompactoCtx = React.createContext(false);
function Phi({ n }) {
  const nCtx = React.useContext(NCtx);
  const compacto = React.useContext(CompactoCtx);
  const v = n ?? nCtx;
  const comValor = v != null && !(compacto && v.toString().length > 12);
  return html`<span className="phi-not">${V("φ")}(${comValor ? html`<span className="phi-n">${agrupar(v)}</span>` : V("n")})</span>`;
}

/* Caracteres invisíveis ganham um símbolo para aparecer na tabela. */
const visivel = (s) => s.replace(/ /g, "␣").replace(/\n/g, "↵").replace(/[\u0000-\u001f]/g, "\uFFFD");

function Num({ v, tom = "", grande = false }) {
  return html`<span className=${`num ${tom} ${grande ? "num-g" : ""}`}>${agrupar(v)}</span>`;
}

function Fichas({ itens, tom = "", max = 32, rotulo }) {
  const vis = itens.slice(0, max);
  return html`<div className="fichas" aria-label=${rotulo}>
    ${vis.map((x, i) => html`<span key=${i} className=${"ficha " + tom}>${typeof x === "bigint" || typeof x === "number" ? agrupar(x) : x}</span>`)}
    ${itens.length > max ? html`<span className="ficha mais">+${itens.length - max}</span>` : null}
  </div>`;
}

function Chip({ tom = "", children }) {
  return html`<span className=${"chip " + tom}>${children}</span>`;
}

function Barra({ titulo, status, onSair, direita }) {
  return html`<header className="barra">
    <div className="barra-in">
      <button className="voltar" onClick=${onSair} aria-label="Voltar ao início">←</button>
      <div className="marca"><span className="marca-rsa">RSA</span> <span className="marca-sala">Room</span></div>
      <span className="barra-titulo">${titulo}</span>
      ${status ? html`<${Chip} tom=${"st-" + status}><span className="ponto"></span>${ROTULO_TRANSPORTE[status] || status}<//>` : null}
      <div className="barra-dir">${direita}</div>
    </div>
  </header>`;
}

/* ============================================================
   ANFITRIÃO
   ============================================================ */
function Anfitriao({ barramento, pinInicial, ensaio = false, nomeInicial = "", onSair }) {
  const [nome, setNome] = useState(() => limparNome(nomeInicial) || "Guardião");
  const [pin] = useState(() => pinInicial || novoPin());
  const [t, status] = useTransporte(pin, barramento);
  const pares = usePares(t);

  const [preset, setPreset] = useState("mini");
  const [modo, setModo] = useState("sorteio");
  const [pIn, setPIn] = useState("61");
  const [qIn, setQIn] = useState("53");
  const [chave, setChave] = useState(() => montarChave(61n, 53n, 17n));
  const [erro, setErro] = useState("");
  const [verD, setVerD] = useState(false);
  const [verEuclides, setVerEuclides] = useState(false);
  const [auto, setAuto] = useState(false);
  const [recebidas, setRecebidas] = useState([]);
  const vistas = useRef(new Set());

  useEffect(() => {
    if (!t) return;
    t.setPresence({ role: "host", n: chave.n.toString(), e: chave.e.toString(), kid: chave.kid, nome });
  }, [t, chave, nome]);

  useEffect(() => {
    const novas = [];
    for (const p of pares) {
      const pr = p.presence || {};
      if (p.isMe || pr.role !== "emissor" || !Array.isArray(pr.msgs)) continue;
      for (const m of pr.msgs) {
        if (!mensagemValida(m)) continue;
        const uid = p.id + ":" + m.id;
        if (vistas.current.has(uid)) continue;
        vistas.current.add(uid);
        novas.push({ uid, nick: String(pr.nick || "Anônimo").slice(0, 20), id: m.id, kid: m.kid, L: m.L, c: m.c, chegou: Date.now() });
      }
    }
    if (novas.length) setRecebidas((velhas) => [...novas.reverse(), ...velhas].slice(0, 80));
  }, [pares]);

  const emissores = pares.filter((p) => !p.isMe && p.presence?.role === "emissor");
  const outrosAnfitrioes = pares.filter((p) => !p.isMe && p.presence?.role === "host");

  /* Os cálculos de chave rodam fora da thread principal (Web Worker), com indicador de carregamento.
     pedidoRef descarta respostas de pedidos antigos (ex.: o usuário digitou outro e no meio). */
  const [calculando, setCalculando] = useState(false);
  const pedidoRef = useRef(0);
  async function calcular(tarefa, aoTerminar) {
    const id = ++pedidoRef.current;
    setCalculando(true);
    try {
      const k = await calcularNoWorker(tarefa);
      if (id !== pedidoRef.current) return;
      if (k.erro) { setErro(k.erro); return; }
      setErro("");
      setChave(k);
      if (aoTerminar) aoTerminar(k);
    } catch (falha) {
      if (id === pedidoRef.current) setErro(falha && falha.message ? falha.message : "Não foi possível calcular as chaves.");
    } finally {
      if (id === pedidoRef.current) setCalculando(false);
    }
  }

/* ============================================================
   Euclides estendido — modo didático (substituição simbólica) e modo tabela
   ============================================================ */
const PHI = html`<span className="sym sym-phi"><${Phi} /></span>`; /* lê n do NCtx */
const SYM_E = html`<span className="sym sym-e">${V("e")}</span>`;
const MENOS = "−";
const absB = (c) => (c < 0n ? -c : c);

/* Um termo c·φ(n) ou c·e, colorido pelo símbolo. "nu" escreve só "e" quando c = 1. */
function Termo({ c, sym, primeiro = false, nu = false }) {
  const neg = c < 0n;
  const corpo = nu && absB(c) === 1n ? "" : agrupar(absB(c)) + "·";
  return html`${primeiro ? null : html`<span className="op">${neg ? MENOS : "+"}</span>`}<span className=${"termo termo-" + sym}>${primeiro && neg ? MENOS : ""}${corpo}${sym === "phi" ? PHI : SYM_E}</span>`;
}

/* s·φ(n) + t·e, omitindo termos nulos. */
function Combinacao({ s, t }) {
  const termos = [];
  if (s !== 0n) termos.push({ c: s, sym: "phi" });
  if (t !== 0n) termos.push({ c: t, sym: "e" });
  if (!termos.length) return html`<span>0</span>`;
  return html`${termos.map((x, i) => html`<${Termo} key=${i} c=${x.c} sym=${x.sym} primeiro=${i === 0} />`)}`;
}

const RotResto = ({ v }) => html`<span className="resto">Resto ${agrupar(v)}</span>`;

/* Como um operando aparece na Fase 1 (só o nome) e na Fase 2 (já em φ(n) e e). */
function NomeItem({ it }) {
  if (it.tipo === "phi") return PHI;
  if (it.tipo === "e") return SYM_E;
  return html`(<${RotResto} v=${it.v} />)`;
}
function ExprItem({ it }) {
  if (it.tipo === "phi") return PHI;
  if (it.tipo === "e") return SYM_E;
  return html`<span className="par">(</span><${Combinacao} s=${it.s} t=${it.t} /><span className="par">)</span>`;
}

/* Lista de coeficientes de um mesmo símbolo: (1 + 3) ou (−150 − 451). */
function Grupo({ coefs, sym }) {
  const partes = coefs.map((c, i) => (i === 0 ? (c < 0n ? MENOS : "") + agrupar(absB(c)) : ` ${c < 0n ? MENOS : "+"} ${agrupar(absB(c))}`)).join("");
  const texto = coefs.length > 1 ? `(${partes})` : partes;
  return html`<span className=${"termo termo-" + sym}>${texto}·${sym === "phi" ? PHI : SYM_E}</span>`;
}

function termosDistribuidos(p) {
  const lista = [];
  if (p.A.tipo === "e") lista.push({ c: 1n, sym: "e", nu: true });
  else {
    if (p.A.s !== 0n) lista.push({ c: p.A.s, sym: "phi" });
    if (p.A.t !== 0n) lista.push({ c: p.A.t, sym: "e" });
  }
  const sB = -p.q * p.B.s, tB = -p.q * p.B.t;
  if (sB !== 0n) lista.push({ c: sB, sym: "phi" });
  if (tB !== 0n) lista.push({ c: tB, sym: "e" });
  return lista;
}

function PassoVolta({ p, i, bezout }) {
  const r = p.r;
  const titulo = html`<span className="volta-t">Passo ${i + 1} <span className="volta-sub">(${bezout ? html`Resto 1 / Equação de Bézout` : html`Resto ${agrupar(r)}`})</span></span>`;
  const lado = bezout ? html`<span className="um">1</span>` : html`<${RotResto} v=${r} />`;
  if (i === 0) {
    return html`<li className=${"volta " + (bezout ? "bezout" : "")}>
      ${titulo}
      <div className="eq">${lado}<span className="op">=</span><${Combinacao} s=${p.novo.s} t=${p.novo.t} /></div>
      <p className="passo-n">Vem direto da primeira divisão: <${Phi} /> aparece uma vez e ${V("e")} aparece ${agrupar(p.q)} vezes.</p>
    </li>`;
  }
  const dist = termosDistribuidos(p);
  const coefPhi = dist.filter((x) => x.sym === "phi").map((x) => x.c);
  const coefE = dist.filter((x) => x.sym === "e").map((x) => x.c);
  const subst = p.A.tipo === "e" ? html`a expressão do Resto ${agrupar(p.B.v)}` : html`os Restos ${agrupar(p.A.v)} e ${agrupar(p.B.v)}`;
  return html`<li className=${"volta " + (bezout ? "bezout" : "")}>
    ${titulo}
    <div className="eq-bloco">
      <div className="eq"><span className="eq-rot">substituindo</span>${lado}<span className="op">=</span><${ExprItem} it=${p.A} /><span className="op">${MENOS}</span><span className="coef">${agrupar(p.q)}</span>·<${ExprItem} it=${p.B} /></div>
      <div className="eq"><span className="eq-rot">distribuindo ${MENOS}${agrupar(p.q)}</span><span className="op">=</span>${dist.map((x, k) => html`<${Termo} key=${k} c=${x.c} sym=${x.sym} nu=${x.nu} primeiro=${k === 0} />`)}</div>
      <div className="eq"><span className="eq-rot">agrupando</span><span className="op">=</span>${coefPhi.length ? html`<${Grupo} coefs=${coefPhi} sym="phi" />` : null}${coefPhi.length && coefE.length ? html`<span className="op">+</span>` : null}${coefE.length ? html`<${Grupo} coefs=${coefE} sym="e" />` : null}</div>
      <div className="eq eq-final"><span className="eq-rot">resultado</span>${lado}<span className="op">=</span><${Combinacao} s=${p.novo.s} t=${p.novo.t} /></div>
    </div>
    <p className="passo-n">Substituímos ${subst} na equação ${bezout ? "do 1" : html`do Resto ${agrupar(r)}`}, distribuímos o ${MENOS}${agrupar(p.q)} e juntamos os termos de <${Phi} /> e de ${V("e")}.</p>
  </li>`;
}

/* Mostra os primeiros e os últimos passos quando a conta é longa. */
function recortar(lista, todos) {
  if (todos || lista.length <= 6) return { vis: lista.map((x, i) => [x, i]), oculto: 0 };
  const vis = [...lista.slice(0, 2).map((x, i) => [x, i]), null, ...lista.slice(-2).map((x, i) => [x, lista.length - 2 + i])];
  return { vis, oculto: lista.length - 4 };
}

function ModoDidatico({ chave }) {
  const ex = useMemo(() => euclidesSimbolico(chave.phi, chave.e), [chave]);
  const [todos, setTodos] = useState(false);
  const { passos, final, x, y } = ex;
  const ida = recortar(passos, todos);
  const volta = recortar(passos, todos);
  const yNeg = y < 0n;
  const dCalc = yNeg ? y + chave.phi : y;
  const produto = chave.e * chave.d;
  const Lacuna = ({ n }) => html`<li className="lacuna"><button className="btn-link" onClick=${() => setTodos(true)}>Mostrar os ${n} passos intermediários</button></li>`;

  return html`<div className="didatico">
    <section className="fase">
      <h4><span className="fase-num">Fase 1</span> Ida: divisões sucessivas e restos isolados</h4>
      <p className="passo-n">Dividimos <${Phi} /> = ${agrupar(chave.phi)} por ${V("e")} = ${agrupar(chave.e)}, depois o divisor pelo resto, até o resto zerar. Em cada linha isolamos o resto.</p>
      <ol className="ida">
        ${ida.vis.map((item, k) => {
          if (!item) return html`<${Lacuna} key="lacuna" n=${ida.oculto} />`;
          const [p] = item;
          return html`<li key=${k}>
            <span className="div-num">${agrupar(p.A.v)} = ${agrupar(p.q)} · ${agrupar(p.B.v)} + ${agrupar(p.r)}</span>
            <span className="eq"><${RotResto} v=${p.r} /><span className="op">=</span><${NomeItem} it=${p.A} /><span className="op">${MENOS}</span><span className="coef">${agrupar(p.q)}</span>·<${NomeItem} it=${p.B} /></span>
          </li>`;
        })}
        <li className="ida-fim">
          <span className="div-num">${agrupar(final.A.v)} = ${agrupar(final.q)} · ${agrupar(final.B.v)} + 0</span>
          <span className="passo-n">O resto zerou. O último resto não nulo é mdc(<${Phi} />, ${V("e")}) = 1, então ${V("e")} tem inverso.</span>
        </li>
      </ol>
    </section>

    <section className="fase">
      <h4><span className="fase-num">Fase 2</span> Volta: cada resto escrito com <${Phi} /> e ${V("e")}</h4>
      <p className="passo-n">Reescrevemos os restos na ordem em que surgiram. Cada um vira uma combinação de <span className="sym sym-phi"><${Phi} /></span> e <span className="sym sym-e">${V("e")}</span>, então o resto seguinte só precisa de substituição e agrupamento.</p>
      <ol className="voltas">
        ${volta.vis.map((item) => {
          if (!item) return html`<${Lacuna} key="lacuna" n=${volta.oculto} />`;
          const [p, i] = item;
          return html`<${PassoVolta} key=${i} p=${p} i=${i} bezout=${i === passos.length - 1} />`;
        })}
      </ol>
      ${todos && passos.length > 6 ? html`<button className="btn-link" onClick=${() => setTodos(false)}>Resumir passos</button>` : null}
    </section>

    <section className="fase">
      <h4><span className="fase-num">Fase 3</span> Ajuste modular final</h4>
      <div className="eq eq-destaque"><span className="um">1</span><span className="op">=</span><${Combinacao} s=${x} t=${y} /></div>
      <ol className="ajuste">
        <li>
          <span>Aplicar mod <${Phi} />: o termo <${Termo} c=${x} sym="phi" primeiro=${true} /> é múltiplo de <${Phi} /> e vale 0.</span>
          <div className="eq"><span className="seta">⟹</span><span className="um">1</span><span className="op">≡</span><${Termo} c=${y} sym="e" primeiro=${true} /><span className="mod">(mod <${Phi} />)</span></div>
        </li>
        <li>
          ${yNeg

function EditorE({ chave, onTrocar }) {
  const [txt, setTxt] = useState(chave.e.toString());

  const val = validarE(txt, chave.phi);

  const usa65537 = 65537n < chave.phi && gcd(65537n, chave.phi) === 1n;

  function mudar(v) {
    const limpo = v.replace(/[^\d]/g, "").slice(0, 60);
    setTxt(limpo);
    const r = validarE(limpo, chave.phi);
    if (r.estado === "ok" && r.e !== chave.e) onTrocar(r.e);

  else if (val.estado === "intervalo") msg = html`<p className="e-erro" role="alert"><b>Fora do intervalo:</b> ${V("e")} precisa ficar entre 2 e ${agrupar(chave.phi - 1n)}, ou seja, 1${" < "}${V("e")}${" < "}<${Phi} />.</p>`;
  else msg = html`<p className="passo-n">Digite um número inteiro.</p>`;

  return html`<div className="editor-e">
    <div className="editor-linha">
      <label htmlFor="in-e-host" className="editor-rot">${V("e")} =</label>
      <input id="in-e-host" className=${"in-e " + (val.estado === "ok" ? "ok" : val.estado === "vazio" || val.estado === "formato" ? "" : "erro")} inputMode="numeric" autoComplete="off" value=${txt} onChange=${(e) => mudar(e.target.value)} aria-describedby="in-e-host-msg" />

      ${menores.map((x) => html`<button type="button" key=${x.toString()} className=${"chip-e " + (x === chave.e ? "on" : "")} onClick=${() => usar(x)}>${agrupar(x)}</button>`)}

function ProvaEuler({ chave, verD }) {

  return html`<details className="prova">

        <div className="prova-eq">${V("e")}·${V("d")} = ${V("k")}·${PHIs} + 1</div>
        <p className="passo-n">Nesta chave: ${verD
          ? html`${agrupar(chave.e)} · ${agrupar(chave.d)} = ${agrupar(ed)} = ${agrupar(k)} · ${agrupar(chave.phi)} + 1, ou seja, ${V("k")} = ${agrupar(k)}.`
          : html`revele ${V("d")} para ver o valor de ${V("k")}.`}</p>
      </li>
      <li>
        <span className="prova-t">Propriedades de potência</span>
        <div className="prova-eq">${V("m")}<sup>${V("e")}·${V("d")}</sup> = ${V("m")}<sup>${V("k")}·${V("φ")}(${V("n")}) + 1</sup> = (${V("m")}<sup>${V("φ")}(${V("n")})</sup>)<sup>${V("k")}</sup> · ${V("m")}<sup>1</sup></div>
      </li>
      <li>
        <span className="prova-t">Teorema de Euler: ${V("m")}<sup>${V("φ")}(${V("n")})</sup> ≡ 1 (mod ${V("n")})</span>
        <div className="prova-eq">(1)<sup>${V("k")}</sup> · ${V("m")}<sup>1</sup> ≡ 1 · ${V("m")} ≡ ${V("m")} (mod ${V("n")})</div>
      </li>
    </ol>
    <p className="prova-nota">Essa identidade garante que a mensagem cifrada ${V("c")} elevada à chave privada ${V("d")} recupera exatamente o valor original de ${V("m")}.</p>
  </details>`;
}

const PRIMOS_FERMAT = { 3: "2¹ + 1", 5: "2² + 1", 17: "2⁴ + 1", 257: "2⁸ + 1", 65537: "2¹⁶ + 1" };

function binarioAgrupado(x) {
  const s = x.toString(2);
  return s.replace(/\B(?=(\d{4})+(?!\d))/g, " ");
}

function TeoriaE({ chave, aberto = true }) {
  const validos = useMemo(() => contarEValidos(chave.phi), [chave.phi]);
  const quadrados = bitLen(chave.e) - 1;
  const mults = popcount(chave.e) - 1;
  const fermat = PRIMOS_FERMAT[chave.e.toString()];
  const cabe65537 = 65537n < chave.phi && gcd(65537n, chave.phi) === 1n;
  return html`<details className="teoria" open=${aberto}>
    <summary>Como escolher ${V("e")}</summary>
    <div className="teoria-corpo">
      <div className="teoria-item">
        <span className="teoria-rot">Regra matemática</span>
        <div className="teoria-eq">1${" < "}${V("e")}${" < "}<${Phi} /> <span className="e-tal">tal que</span> mdc(${V("e")}, <${Phi} />) = 1</div>
        <p>${V("e")} e <${Phi} /> precisam ser coprimos. Só assim a identidade de Bézout garante um ${V("d")} com ${V("e")}·${V("d")} ≡ 1 (mod <${Phi} />), que é a chave privada.</p>
      </div>
      <div className="teoria-item">
        <span className="teoria-rot">Geração</span>
        <p>Qualquer valor coprimo com <${Phi} /> nesse intervalo funciona, então ${V("e")} pode ser sorteado entre eles.${validos !== null ? html` Para esta chave há <b>${agrupar(validos)}</b> escolhas válidas, contadas como ${V("φ")}(<${Phi} />) = ${V("φ")}(${agrupar(chave.phi)}), menos o ${V("e")} = 1.` : null}</p>
      </div>
      <div className="teoria-item">
        <span className="teoria-rot">Padrão de mercado (chaves grandes)</span>
        <p>Em chaves RSA reais, de 2048 bits ou mais, o padrão é o primo de Fermat ${V("e")} = 65537 = 2¹⁶ + 1. Em binário ele é <span className="bin">1 0000 0000 0000 0001</span>: só dois bits 1. Por isso ${V("m")}<sup>${V("e")}</sup> mod ${V("n")} custa 16 quadrados e uma única multiplicação. Um ${V("e")} sorteado com 2048 bits custaria cerca de 2047 quadrados e mil multiplicações.</p>
        <p className="teoria-atual">
          Nesta chave, ${V("e")} = ${agrupar(chave.e)}${fermat ? html` = ${fermat}, primo de Fermat` : null}, em binário <span className="bin">${binarioAgrupado(chave.e)}</span>: ${quadrados} quadrado${quadrados === 1 ? "" : "s"} e ${mults} multiplicaç${mults === 1 ? "ão" : "ões"} por bloco.
          ${!cabe65537 && chave.e !== 65537n && 65537n >= chave.phi ? html` O 65537 não cabe aqui porque é maior que <${Phi} />.` : null}
        </p>
      </div>
    </div>
  </details>`;
}

const ENDERECO_SALA ="claude.ai/artifact/79GWKS1cAwesvKpDicDwZk";

/* Endereço de entrada direta do participante, com o PIN.
   Fora do Claude (ex.: GitHub Pages): domínio atual + #/participante?pin=123456.
   Dentro do visualizador do Claude a página roda num domínio isolado e só um #nome simples
   atravessa o link do artifact, então ali o endereço é o do artifact com #entrar-123456. */
function linkSala(pin) {
  const noVisualizador = window.top !== window.self || typeof window.claude?.use === "function";
  if (noVisualizador) return `https://${ENDERECO_SALA}#entrar-${pin}`;
  return `${window.location.origin}${window.location.pathname}#/participante?pin=${pin}`;
}

function QrSala({ link }) {
  const qr = useMemo(() => {
    if (typeof qrcode !== "function") return null;
    try {
      const q = qrcode(0, "M");
      q.addData(link);
      q.make();
      const n = q.getModuleCount();
      let d = "";
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
      return { n, d };
    } catch (_) { return null; }
  }, [link]);
  if (!qr) return html`<p className="qr-falha">QR Code indisponível. Use o PIN ou o link abaixo.</p>`;
  const m = 3, lado = qr.n + 2 * m;
  return html`<div className="qr">
    <svg viewBox=${`${-m} ${-m} ${lado} ${lado}`} role="img" aria-label=${"QR Code para entrar na sala: " + link} shapeRendering="crispEdges">
      <rect x=${-m} y=${-m} width=${lado} height=${lado} fill="#FFFFFF" />
      <path d=${qr.d} fill="#0F1A2C" />
    </svg>
  </div>`;
}
