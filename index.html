function LinkDireto({ pin }) {
  const [copiado, setCopiado] = useState(false);
  const ref = useRef(null);
  /* Domínio atual da aplicação (ex.: GitHub Pages). Dentro do visualizador do Claude, a página roda
     num domínio isolado que não abre para outras pessoas, então ali o link usa o endereço do artifact. */
  const link = linkSala(pin);
  const exibido = link.replace(/^https?:\/\//, "");
  function copiar() {
    const selecionar = () => {
      const r = document.createRange();
      r.selectNodeContents(ref.current);
      const s = getSelection();
      s.removeAllRanges();
      s.addRange(r);
    };
    try {
      navigator.clipboard.writeText(link).then(() => { setCopiado(true); setTimeout(() => setCopiado(false), 2000); }, selecionar);
    } catch (_) { selecionar(); }
  }
  return html`<div className="link-direto">
    <span className="pin-rot">Link direto, já com o PIN</span>
    <div className="link-linha">
      <code ref=${ref}>${exibido}</code>
      <button className="btn-copiar" onClick=${copiar}>${copiado ? "Copiado" : "Copiar"}</button>
    </div>
  </div>`;
}

const MAX_BLOCOS = 24;

function MensagemHost({ m, chave, auto }) {
  const compativel = m.kid === chave.kid;
  const [aberta, setAberta] = useState(auto);
  const res = useMemo(() => {
    if (!compativel) return null;
    const cs = m.c.map((x) => BigInt(x));
    if (cs.some((c) => c >= chave.n)) return { invalida: true };
    const ms = cs.map((c) => modPow(c, chave.d, chave.n));
    const bytes = blocosParaBytes(ms, chave.k, m.L);
    const chars = segmentarUtf8(bytes);
    const texto = chars.map((x) => x.texto).join("");
    const celulas = celulasPorBloco(chars, chave.k, Math.min(ms.length, MAX_BLOCOS));
    return { cs, ms, texto, celulas };
  }, [m, chave, compativel]);
  const [rev, setRev] = useState(0);

  useEffect(() => {
    if (!aberta || !res || res.invalida) return;
    if (reduzMovimento()) { setRev(res.ms.length); return; }
    setRev(0);
    let i = 0;
    const passo = Math.max(30, Math.min(160, 1400 / res.ms.length));
    const iv = setInterval(() => { i++; setRev(i); if (i >= res.ms.length) clearInterval(iv); }, passo);
    return () => clearInterval(iv);
  }, [aberta, res]);

  const hora = new Date(m.chegou).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const pronta = res && !res.invalida && rev >= res.ms.length;
  const MAX = MAX_BLOCOS;

  return html`<article className=${"msg " + (pronta ? "msg-ok" : "")}>
    <header className="msg-cab">
      <b className="msg-nick"><span className=${"caixa-ico " + (pronta ? "aberta" : "")} aria-label=${pronta ? "Caixa aberta" : "Caixa trancada"}>${pronta ? "📦" : "🔒"}</span>${m.nick}</b>
      <span className="msg-meta">${hora} · ${m.c.length} bloco${m.c.length > 1 ? "s" : ""}</span>
    </header>
    ${!compativel
      ? html`<p className="aviso">Cifrada com um cadeado anterior (<span className="id-chave" tabIndex="0" title="Código identificador único do par de chaves público/privado antigo." aria-label=${"ID da chave: " + m.kid + ". Código identificador único do par de chaves público/privado antigo."}>ID da chave: ${m.kid}</span>). A chave privada atual não a decifra.</p>
          <${Fichas} itens=${m.c} max=${MAX} rotulo="Blocos cifrados" />`
      : res.invalida
        ? html`<p className="aviso">Há blocos maiores que ${V("n")}: esta cifra não foi gerada com a chave pública atual.</p>`
        : html`<div className="tabela-rolagem">
            <table className="blocos">
              <tbody>
                <tr className="linha-txt"><th scope="row">texto</th>${res.celulas.map((cel) => {
                  const ok = rev >= cel.ini + cel.span;
                  return html`<td key=${cel.ini} colSpan=${cel.span} className=${(ok ? "rev " : "") + (cel.span > 1 ? "multi" : "")} title=${ok && cel.span > 1 ? `“${cel.texto}” ocupa ${cel.span} blocos` : undefined}>${ok ? visivel(cel.texto) : "·"}</td>`;
                })}${m.c.length > MAX ? html`<td className="mais"></td>` : null}</tr>
                <tr><th scope="row"><span className="th-ico" aria-hidden="true">🔒</span>${V("c")}</th>${m.c.slice(0, MAX).map((c, i) => html`<td key=${i}>${agrupar(c)}</td>`)}${m.c.length > MAX ? html`<td className="mais">+${m.c.length - MAX}</td>` : null}</tr>
                <tr className="linha-m"><th scope="row"><span className="th-ico" aria-hidden="true">${pronta ? "📦" : "🔒"}</span>${V("m")}</th>${res.ms.slice(0, MAX).map((x, i) => html`<td key=${i} className=${i < rev ? "rev" : ""}>${i < rev ? agrupar(x) : "·"}</td>`)}${m.c.length > MAX ? html`<td className="mais"></td>` : null}</tr>
              </tbody>
            </table>
          </div>
          ${aberta
            ? html`<p className=${"claro " + (pronta ? "visivel" : "")}>${pronta ? res.texto : `Decifrando bloco ${Math.min(rev + 1, res.ms.length)} de ${res.ms.length}…`}</p>`
            : html`<button className="btn btn-priv" onClick=${() => setAberta(true)}>Decifrar com ${V("d")}</button>`}`}
  </article>`;
}

/* Cada caractere sobre os seus bytes. Letras de vários bytes (á = 195 161) ganham destaque. */
function MapaUtf8({ chars, bytes, k, maxBytes = 28 }) {
  const vis = [];
  let total = 0;
  for (const c of chars) {
    const nb = c.fim - c.ini;
    if (vis.length && total + nb > maxBytes) break;
    vis.push(c);
    total += nb;
  }
  const restantes = chars.length - vis.length;
  return html`<div className="mapa-utf8">
    ${vis.map((c, i) => {
      const nb = c.fim - c.ini;
      return html`<div key=${i} className=${"gc " + (nb > 1 ? "gc-multi" : "")}>
        <span className="gc-char">${visivel(c.texto)}</span>
        <span className="gc-bytes">${bytes.slice(c.ini, c.fim).map((b, j) => html`<span key=${j} className="ficha">${b}</span>`)}</span>
        ${nb > 1 ? html`<span className="gc-tag">${nb} bytes${k === 1 ? ` = ${nb} blocos` : ""}</span>` : null}
      </div>`;
    })}
    ${restantes ? html`<span className="ficha mais">+${restantes} caractere${restantes > 1 ? "s" : ""}</span>` : null}
  </div>`;
}

function aparar(msgs) {
  let lista = msgs.slice(-6).map(({ id, kid, L, c }) => ({ id, kid, L, c }));
  while (lista.length > 1 && codificador.encode(JSON.stringify(lista)).length > 3400) lista = lista.slice(1);
  return lista;
}

const LIMITES_TEMPO = [15, 30, 60, 120];

/* Ritmos do ataque. ops = divisões por tick; opsCrivo = marcações por tick na fase do crivo. */
const VELOCIDADES = {
  lenta: { nome: "Câmera lenta (1 divisão a cada 0,25 s)", intervalo: 250, ops: 1, opsCrivo: 25, orcamentoMs: 20, registrar: true },
  didatica: { nome: "Didática (50 divisões a cada 100 ms)", intervalo: 100, ops: 50, opsCrivo: 1000, orcamentoMs: 20, registrar: true },
  maxima: { nome: "Máxima (o computador a toda força)", intervalo: 16, ops: Infinity, opsCrivo: Infinity, orcamentoMs: 30, registrar: false },
};

/* Quanto do caminho até √n já foi percorrido, legível mesmo quando é minúsculo. */
function fracaoLegivel(cand, raiz) {
  const f = (Number(cand) / Number(raiz)) * 100;
  if (!isFinite(f) || f >= 0.01) return html`${Math.min(100, f).toLocaleString("pt-BR", { maximumFractionDigits: 2 })}%`;
  return html`≈ 10<sup>${Math.floor(Math.log10(f))}</sup>%`;
}

function Interceptador({ barramento, pinInicial = "", auto = false, embutido = false, onSair }) {
  const [pin, setPin] = useState(pinInicial);
  const [pinAtivo, setPinAtivo] = useState(auto && pinInicial ? pinInicial : null);
  const [erroEntrada, setErroEntrada] = useState("");
  const [t, status] = useTransporte(pinAtivo, barramento);
  const pares = usePares(t);
  /* Realismo: o interceptador não publica presença; o anfitrião não tem como saber que está sendo ouvido. */

  const anfitriao = pares.find((p) => !p.isMe && p.presence?.role === "host" && numeroDaSala(String(p.presence.n || "")) && numeroDaSala(String(p.presence.e || "")));
  const nomeHost = anfitriao ? limparNome(anfitriao.presence.nome) : "";
  const chave = useMemo(() => {
    if (!anfitriao) return null;
    const n = BigInt(anfitriao.presence.n), e = BigInt(anfitriao.presence.e);
    return { n, e, k: bytesPorBloco(n), kid: String(anfitriao.presence.kid || impressao(n)).slice(0, 12) };
  }, [anfitriao?.presence?.n, anfitriao?.presence?.e]);

  /* Captura tudo o que passa pela via pública. */
  const [capturadas, setCapturadas] = useState([]);
  const vistas = useRef(new Set());
  useEffect(() => {
    const novas = [];
    for (const p of pares) {
      const pr = p.presence || {};
      if (p.isMe || pr.role !== "emissor" || !Array.isArray(pr.msgs)) continue;
      for (const m of pr.msgs) {
        if (!mensagemValida(m)) continue;
        const uid = p.id + ":" + m.id;
        if (vistas.current.has(uid)) continue;
        vistas.current.add(uid);
        novas.push({ uid, nick: String(pr.nick || "Anônimo").slice(0, 20), kid: m.kid, L: m.L, c: m.c });
      }
    }
    if (novas.length) setCapturadas((v) => [...novas.reverse(), ...v].slice(0, 40));
  }, [pares]);

  const [alg, setAlg] = useState("divisao");
  const [limite, setLimite] = useState(30);
  const [velocidade, setVelocidade] = useState("didatica");
  const [placar, setPlacar] = useState(null);
  const crivoOk = chave ? crivoPossivel(chave.n) : false;
  useEffect(() => { if (!crivoOk && alg === "crivo") setAlg("divisao"); }, [crivoOk, alg]);

  /* Um único timer por vez. timerRef guarda o setInterval; motorRef guarda o ataque em curso,
     e um tick de um ataque antigo que ainda chegue se desliga sozinho. */
  const timerRef = useRef(null);
  const motorRef = useRef(null);
  function pararTimer() {
    if (timerRef.current !== null) { clearInterval(timerRef.current); timerRef.current = null; }
  }
  function parar() { pararTimer(); motorRef.current = null; }
  useEffect(() => () => parar(), []);
  useEffect(() => { parar(); setPlacar(null); }, [chave?.n]);

  function atacar() {
    if (!chave) return;
    parar();
    setPlacar(null);
    const cfg = VELOCIDADES[velocidade];
    const motor = criarAtaque(chave.n, alg);
    motorRef.current = motor;
    const inicio = agora();
    const limiteMs = limite * 1000;
    const instantaneo = () => ({ ...motor.estado, ultimos: [...motor.estado.ultimos], decorrido: agora() - inicio, limiteMs, velocidade, lenta: cfg.registrar, n: chave.n, e: chave.e, kid: chave.kid });
    const tick = () => {
      if (motorRef.current !== motor) return;
      const ops = motor.estado.fase === "crivo" ? cfg.opsCrivo : cfg.ops;
      const st = motor.passo(cfg.orcamentoMs, ops, cfg.registrar);
      const snap = instantaneo();
      let fim = st.achou || st.acabou;
      if (!fim && snap.decorrido >= limiteMs) { snap.esgotado = true; fim = true; }
      if (fim) parar();
      setPlacar(snap);
    };
    setPlacar(instantaneo());
    timerRef.current = setInterval(tick, cfg.intervalo);
  }

  /* Quando o n é fatorado, o hacker refaz a matemática do anfitrião. */
  const quebra = useMemo(() => {
    if (!placar?.achou || !chave || placar.n !== chave.n) return null;
    const k = montarChave(placar.achou.p, placar.achou.q, chave.e);
    return k.erro ? null : k;
  }, [placar?.achou, chave]);

  /* Mensagens abertas ficam abertas para sempre, mesmo que o anfitrião troque de chave depois.
     lidas: uid → texto decifrado. kidQuebrado: impressão da chave que o hacker fatorou. */
  const [lidas, setLidas] = useState({});
  const kidQuebrado = quebra ? placar.kid : null;
  useEffect(() => {
    if (!quebra) return;
    const novas = {};
    for (const m of capturadas) {
      if (m.kid !== kidQuebrado || lidas[m.uid] !== undefined) continue;
      try {
        novas[m.uid] = deBlocos(m.c.map((x) => modPow(BigInt(x), quebra.d, quebra.n)), quebra.k, m.L);
      } catch (_) {}
    }
    if (Object.keys(novas).length) setLidas((v) => ({ ...v, ...novas }));
  }, [quebra, capturadas]);
  const lerComChaveQuebrada = (m) => (lidas[m.uid] !== undefined ? lidas[m.uid] : null);

  function entrar(ev) {
    ev.preventDefault();
    if (!/^\d{6}$/.test(pin.trim())) { setErroEntrada("O PIN tem 6 dígitos. É o mesmo número projetado pelo anfitrião."); return; }
    setErroEntrada("");
    setPinAtivo(pin.trim());
  }

  const rodando = placar && !placar.achou && !placar.acabou && !placar.esgotado;
  const seg = placar ? placar.decorrido / 1000 : 0;
  const taxa = placar && seg > 0.05 ? placar.testes / seg : 0;

  let etaTotal = null;
  if (placar && taxa > 0) {
    const raizNum = Number(placar.raiz);
    const totalTestes = placar.alg === "crivo" ? raizNum / Math.max(1, Math.log(raizNum)) : raizNum / 2;
    etaTotal = isFinite(totalTestes) ? totalTestes / taxa : Infinity;
  }
  /* A projeção para 2048 bits usa o ritmo máximo do navegador, não o ritmo freado da aula. */
  const anos2048 = Math.round(1023 * Math.log10(2) - Math.log10(2e7) - Math.log10(31536000));
  const pct = placar ? (placar.fase === "crivo" ? null : fracaoLegivel(placar.candidato, placar.raiz)) : null;
  const barra = placar ? (placar.achou ? 100 : placar.fase === "crivo" ? placar.progressoCrivo * 100 : Math.min(100, Number((placar.candidato * 10000n) / (placar.raiz || 1n)) / 100)) : 0;

  const corpo = !pinAtivo
    ? html`<form className="entrada painel painel-hacker" onSubmit=${entrar}>
        <h2>Grampear uma sala</h2>
        <p className="passo-n">Digite o PIN da sala. Você vai enxergar tudo o que passa pela via pública, mas não a chave privada.</p>
        <label className="campo" htmlFor="in-pin-h"><span>PIN</span>
          <input id="in-pin-h" className="in-pin" inputMode="numeric" autoComplete="off" maxLength="6" placeholder="000000" value=${pin} onChange=${(e) => setPin(e.target.value.replace(/\D/g, ""))} />
        </label>
        ${erroEntrada ? html`<p className="erro" role="alert">${erroEntrada}</p>` : null}
        <button className="btn btn-hacker" type="submit">Começar a interceptar</button>
      </form>`
    : html`<div className="part hacker">
        <div className="part-cab">
          <span>🕵️ ${nomeHost ? html`Interceptando mensagens da sala de <b>${nomeHost}</b> · PIN <b>${pinAtivo}</b>` : html`Grampo na sala <b>${pinAtivo}</b>`}</span>
          ${embutido ? null : html`<button className="btn-link" onClick=${() => { parar(); setPinAtivo(null); setCapturadas([]); setLidas({}); vistas.current = new Set(); setPlacar(null); }}>Trocar de sala</button>`}
        </div>
        ${!chave
          ? html`<div className="painel aguardando">
              <div className="pontinhos" aria-hidden="true"><span></span><span></span><span></span></div>
              <p><b>Esperando o anfitrião publicar a chave pública…</b></p>
            </div>`
          : html`<div className="part-grid">
              <div className="interceptado">
                <span className="ck-rot">Interceptado na via pública</span>
                <div className="int-chave">(${V("e")}, ${V("n")}) = (${agrupar(chave.e)}, ${agrupar(chave.n)})</div>
                <p className="passo-n">Para ler as mensagens você precisa de ${V("d")}. Para calcular ${V("d")} precisa de ${V("φ")}(${V("n")}) = (${V("p")} − 1)(${V("q")} − 1). Ou seja: descobrir os dois primos que multiplicados dão ${V("n")}.</p>
              </div>

              <section className="painel ataque" aria-labelledby="h-ataque">
                <h3 id="h-ataque">Tentando forçar a fechadura do cadeado <span className="h-sub">(Fatorando ${V("n")} = ${V("p")} · ${V("q")})</span></h3>
                <div className="ataque-opcoes">
                  <div className="segmentado" role="tablist" aria-label="Algoritmo">
                    <button role="tab" aria-selected=${alg === "divisao"} className=${alg === "divisao" ? "on" : ""} disabled=${rodando} onClick=${() => setAlg("divisao")}>Divisão por tentativas</button>
                    <button role="tab" aria-selected=${alg === "crivo"} className=${alg === "crivo" ? "on" : ""} disabled=${rodando || !crivoOk} onClick=${() => setAlg("crivo")}>Crivo de Eratóstenes</button>
                  </div>
                  <label className="ataque-sel" htmlFor=${"lim-" + pinAtivo}>Tempo
                    <select id=${"lim-" + pinAtivo} value=${limite} disabled=${rodando} onChange=${(e) => setLimite(Number(e.target.value))}>
                      ${LIMITES_TEMPO.map((x) => html`<option key=${x} value=${x}>${x} s</option>`)}
                    </select>
                  </label>
                  <label className="ataque-sel" htmlFor=${"vel-" + pinAtivo}>Velocidade
                    <select id=${"vel-" + pinAtivo} value=${velocidade} disabled=${rodando} onChange=${(e) => setVelocidade(e.target.value)}>
                      ${Object.entries(VELOCIDADES).map(([k, v]) => html`<option key=${k} value=${k}>${v.nome}</option>`)}
                    </select>
                  </label>
                </div>
                <p className="passo-n">${alg === "divisao"
                  ? html`Testa 2, 3, 5, 7, 9, 11… um por um, até √${V("n")}. Se algum dividir ${V("n")} sem resto, ${V("n")} está quebrado.`
                  : html`Primeiro risca os múltiplos de 3, 5, 7… até √${V("n")} e sobra só a lista de primos. Depois divide ${V("n")} apenas por eles: menos divisões, mas gasta memória.`}
                  ${!crivoOk ? html` O crivo fica indisponível aqui: √${V("n")} tem ${isqrt(chave.n).toString().length} dígitos e a lista não caberia na memória do navegador.` : null}</p>

                <div className="ataque-acoes">
                  ${rodando
                    ? html`<button className="btn btn-sec" onClick=${() => { parar(); setPlacar((p) => p && { ...p, esgotado: true, parado: true }); }}>Parar ataque</button>`
                    : html`<button className="btn btn-hacker" onClick=${atacar}>${placar ? "Atacar de novo" : "Iniciar ataque"}</button>`}
                  <span className=${"cronometro " + (rodando && restante < 5 ? "urgente" : "")}>${restante.toFixed(1).replace(".", ",")} s</span>
                </div>

                <${Fechadura} estado=${!placar ? "parada" : placar.achou ? "aberta" : rodando ? "forcando" : "resistiu"} progresso=${barra} candidato=${placar ? placar.candidato : null} />
                ${placar ? html`<div className="placar">
                  <div className="trilho"><div className=${"trilho-barra " + (placar.achou ? "ok" : "")} style=${{ width: Math.max(0.6, barra) + "%" }}></div></div>
                  <div className="placar-grade">
                    <div><span className="pl-rot">${placar.fase === "crivo" ? "Riscando múltiplos" : "Candidato atual"}</span><b className="num">${agrupar(placar.candidato)}</b></div>
                    <div><span className="pl-rot">Limite √${V("n")}</span><b className="num">${agrupar(placar.raiz)}</b></div>
                    <div><span className="pl-rot">Divisões feitas</span><b className="num">${placar.testes.toLocaleString("pt-BR")}</b></div>
                    <div><span className="pl-rot">Ritmo</span><b className="num">${taxa ? Math.round(taxa).toLocaleString("pt-BR") + "/s" : "—"}</b></div>
                    ${placar.alg === "crivo" ? html`<div><span className="pl-rot">Marcações do crivo</span><b className="num">${placar.marcados.toLocaleString("pt-BR")}</b></div>` : null}
                    ${pct ? html`<div><span className="pl-rot">Caminho até √${V("n")}</span><b className="num">${pct}</b></div>` : null}
                  </div>
                  ${placar.lenta && placar.ultimos.length ? html`<div className="tentativas" aria-live="polite">
                    ${placar.ultimos.map((u, i) => html`<span key=${i} className=${"tentativa " + (u.resto === 0 || u.resto === 0n ? "acerto" : "")}>${agrupar(chave.n)} ÷ ${agrupar(u.d)} → resto ${agrupar(u.resto)} ${u.resto === 0 || u.resto === 0n ? "✓" : "✗"}</span>`)}
                  </div>` : null}

                  ${placar.achou && quebra ? html`<div className="veredito quebrado" role="status">
                    <b>Chave quebrada em ${formatarDuracao(placar.decorrido / 1000)}.</b>
                    <span>${V("n")} = ${agrupar(quebra.p)} × ${agrupar(quebra.q)} → <span className="phi-not">${V("φ")}(${agrupar(quebra.n)})</span> = ${agrupar(quebra.phi)} → ${V("d")} = <b className="num priv">${agrupar(quebra.d)}</b></span>
                    <span className="passo-n">Com primos deste tamanho, o RSA não protege nada. As mensagens abaixo já estão abertas.</span>
                  </div>` : null}
                  ${placar.esgotado && !placar.achou ? html`<div className="veredito resistiu" role="status">
                    <b>${placar.parado ? "Ataque interrompido." : "Tempo esgotado: o RSA resistiu."}</b>
                    <span>Foram ${placar.testes.toLocaleString("pt-BR")} divisões sem achar um fator.${etaTotal !== null ? html` No ritmo atual, testar tudo até √${V("n")} levaria <b>${formatarDuracao(etaTotal)}</b>.` : null}</span>
                    ${placar.velocidade !== "maxima" ? html`<span className="passo-n">Este ataque foi freado para a aula. Escolha a velocidade “Máxima” para ver o computador a toda força.</span>` : null}
                    <span className="passo-n">Uma chave real de 2048 bits, mesmo no ritmo máximo deste navegador (cerca de 20 milhões de divisões por segundo), levaria cerca de 10<sup>${anos2048}</sup> anos.</span>
                  </div>` : null}
                </div>` : null}
              </section>

              <div className="enviadas">
                <h3>Caixas Trancadas Interceptadas 🔒 <span className="contagem">${capturadas.length}</span></h3>
                ${capturadas.length
                  ? capturadas.map((m) => {
                      const lido = lerComChaveQuebrada(m);
                      return html`<div key=${m.uid} className="enviada">
                        <div className="enviada-cab"><b>${m.nick}</b>${lido !== null ? html`<${Chip} tom="quebrado-chip">lida<//>` : html`<${Chip}>trancada<//>`}</div>
                        <${Fichas} itens=${m.c} tom=${lido !== null ? "pub selada aberta" : "pub selada"} max=${12} rotulo="Cifra capturada" />
                        ${lido !== null ? html`<p className="lido">“${lido}”</p>` : null}
                      </div>`;
                    })
                  : html`<p className="vazio">Nada passou pela via pública ainda. Quando um participante enviar, a cifra aparece aqui.</p>`}
              </div>
            </div>`}
      </div>`;

  if (embutido) return corpo;
  return html`<div className="tela">
    <${Barra} titulo="Interceptador" status=${pinAtivo ? status : null} onSair=${onSair} />
    <div className="wrap estreito">${corpo}</div>
  </div>`;
}

/* Indicador da fechadura: 12 pinos que vão "caindo" conforme o ataque avança até √n. */
function Fechadura({ estado, progresso, candidato }) {
  const PINOS = 12;
  const caidos = estado === "aberta" ? PINOS : Math.floor((progresso / 100) * PINOS);
  const rotulo = { parada: "Cadeado intacto. Escolha o algoritmo e comece.", forcando: "Forçando a fechadura…", aberta: "Fechadura aberta: o segredo caiu.", resistiu: "A fechadura resistiu." }[estado];
  return html`<div className=${"fechadura fe-" + estado} role="img" aria-label=${rotulo + " " + Math.round(progresso) + "% dos pinos"}>
    <span className="fe-ico" aria-hidden="true">${estado === "aberta" ? "🔓" : "🔒"}</span>
    <div className="fe-corpo">
      <div className="fe-pinos" aria-hidden="true">${Array.from({ length: PINOS }, (_, i) => html`<span key=${i} className=${"pino " + (i < caidos ? "caido" : i === caidos && estado === "forcando" ? "mexendo" : "")}></span>`)}</div>
      <span className="fe-rot">${rotulo}${estado === "forcando" && candidato != null ? html` <span className="fe-cand">tentando ${agrupar(candidato)}</span>` : null}</span>
    </div>
  </div>`;
}

/* ============================================================
   INÍCIO
   ============================================================ */
function ModalGuardiao({ nomeSalvo, onCriar, onFechar }) {
  const [nome, setNome] = useState(nomeSalvo || "");
  const [erro, setErro] = useState("");
  useEffect(() => {
    const esc = (e) => { if (e.key === "Escape") onFechar(); };
    window.addEventListener("keydown", esc);
    return () => window.removeEventListener("keydown", esc);
  }, []);
  function enviar(ev) {
    ev.preventDefault();
    const n = limparNome(nome);
    if (!n) { setErro("Escreva um nome ou apelido. É assim que a turma vai reconhecer a sua sala."); return; }
    onCriar(n);
  }
  return html`<div className="modal-fundo" onClick=${(e) => { if (e.target === e.currentTarget) onFechar(); }}>
    <form className="modal" role="dialog" aria-modal="true" aria-labelledby="h-modal" onSubmit=${enviar}>
      <span className="modal-glifo">${V("d")}</span>
      <h2 id="h-modal">Criar sala</h2>
      <label className="campo" htmlFor="in-guardiao"><span>Seu Nome ou Apelido</span>
        <input id="in-guardiao" maxLength="30" autoFocus autoComplete="name" placeholder="Ex.: Rivest, Shamir, Adleman..." value=${nome} onChange=${(e) => setNome(e.target.value)} />
      </label>
      <p className="passo-n">Aparece para os participantes como “Conectado à sala de …”.</p>
      ${erro ? html`<p className="erro" role="alert">${erro}</p>` : null}
      <div className="modal-acoes">
        <button type="button" className="btn btn-sec" onClick=${onFechar}>Cancelar</button>
        <button type="submit" className="btn btn-priv">Criar sala →</button>
      </div>
    </form>
  </div>`;
}

function Inicio({ ir, nomeSalvo, onCriar }) {
  const ex = useMemo(() => montarChave(61n, 53n, 17n), []);

  return html`<div className="wrap inicio">
    <header className="hero">

    <div className="papeis">
      <button className="papel papel-host" onClick=${() => setModal(true)}>
        <span className="papel-glifo">${V("d")}</span>

        <span className="papel-apelido">O Emissor 🔒</span>
        <span className="papel-desc">Utiliza o cadeado público do anfitrião para trancar uma mensagem e enviá-la com segurança pela via pública de comunicação.</span>
        <span className="papel-cta">Entrar com PIN →</span>
      </button>
      <button className="papel papel-hacker" onClick=${() => ir("hacker")}>
        <span className="papel-glifo papel-emoji" aria-hidden="true">🕵️‍♂️</span>
        <span className="papel-nome">Interceptador</span>
        <span className="papel-apelido">O Hacker 🕵️‍♂️</span>
        <span className="papel-desc">Captura as mensagens trancadas no meio do caminho e tenta adivinhar a chave por força bruta antes que o tempo acabe.</span>
        <span className="papel-cta">Modo Hacker →</span>
      </button>

    <section className="solo" aria-labelledby="h-solo">

      </div>
      <div className="solo-trio" aria-hidden="true">
        <span className="trio t-host">${V("d")}</span><span className="trio t-part">${V("e")}</span><span className="trio t-hacker">🕵️‍♂️</span>
      </div>

      <div className="pratica-corpo">
        <p className="pratica-nota">Multiplicar dois números primos (61 × 53 = 3233) é instantâneo para um computador, mas descobrir quais dois primos geraram o número 3233 sem saber a resposta é extremamente difícil. Em chaves reais de 2048 bits, esta descoberta levaria bilhões de anos.</p>
        <div className="pratica-passos">
          <div className="pp"><span className="pp-rot">Ida: fácil</span><span className="pp-eq">61 × 53 = 3233</span><span className="passo-n">Uma multiplicação.</span></div>
          <div className="pp pp-dificil"><span className="pp-rot">Volta: difícil</span><span className="pp-eq">3233 = ? × ?</span><span className="passo-n">Testar 3, 5, 7, 11… até achar o 53. Com 617 dígitos, a lista não acaba.</span></div>
        </div>
        <h3 className="pratica-sub">O exemplo completo</h3>

      </div>
    </details>
    ${modal ? html`<${ModalGuardiao} nomeSalvo=${nomeSalvo} onCriar=${onCriar} onFechar=${() => setModal(false)} />` : null}
  </div>`;
}

/* ============================================================
   App + rotas por hash (#anfitriao, #participante, #ensaio, #entrar-123456)
   ============================================================ */
function lerHash() {
  const h = (location.hash || "").replace(/^#/, "");
  const m = /^entrar-(\d{6})$/.exec(h) || /^\/participante\?(?:.*&)?pin=(\d{6})/.exec(h);
  if (m) return { tela: "participante", pin: m[1] };
  const barra = /^\/(anfitriao|participante|ensaio|hacker)$/.exec(h);
  if (barra) return { tela: barra[1] };
  if (["anfitriao", "participante", "ensaio", "hacker"].includes(h)) return { tela: h };
  return { tela: "inicio" };
}

/* Se algo falhar ao desenhar uma tela, mostra o erro em vez de uma página vazia. */
class Guarda extends React.Component {
  constructor(props) { super(props); this.state = { erro: null }; }
  static getDerivedStateFromError(erro) { return { erro }; }
  componentDidCatch(erro) { console.error(erro); }
  render() {
    if (!this.state.erro) return this.props.children;
    return html`<div className="wrap estreito">
      <div className="painel falha" role="alert">
        <h2>Esta tela encontrou um erro</h2>
        <p className="passo-n">Volte ao início e tente de novo. Se repetir, envie a mensagem abaixo para quem mantém o RSA Room.</p>
        <pre>${String(this.state.erro && (this.state.erro.message || this.state.erro))}</pre>
        <button className="btn" onClick=${() => { this.setState({ erro: null }); this.props.onSair(); }}>Voltar ao início</button>
      </div>
    </div>`;
  }
}

function App() {
  const [rota, setRota] = useState(lerHash);
  const [nomeHost, setNomeHost] = useState(nomeLembrado);
  useEffect(() => {
    const f = () => setRota(lerHash());
    window.addEventListener("hashchange", f);
    return () => window.removeEventListener("hashchange", f);
  }, []);
  const ir = (tela) => {
    const alvo = tela === "inicio" ? "" : tela;
    if (location.hash.replace(/^#/, "") === alvo) setRota(lerHash());
    else location.hash = alvo;
    if (tela === "inicio" && !alvo) setRota({ tela: "inicio" });
    window.scrollTo(0, 0);
  };
  const sair = () => ir("inicio");
  let tela;
  if (rota.tela === "anfitriao") tela = html`<${Anfitriao} nomeInicial=${nomeHost} onSair=${sair} />`;
  else if (rota.tela === "participante") tela = html`<${Participante} key=${rota.pin || "sem-pin"} pinInicial=${rota.pin || ""} pinDoLink=${!!rota.pin} onSair=${sair} />`;
  else if (rota.tela === "ensaio") tela = html`<${Ensaio} onSair=${sair} />`;
  else if (rota.tela === "hacker") tela = html`<${Interceptador} onSair=${sair} />`;
  else tela = html`<${Inicio} ir=${ir} nomeSalvo=${nomeHost} onCriar=${(n) => { setNomeHost(n); lembrarNome(n); ir("anfitriao"); }} />`;
  return html`<${Guarda} key=${rota.tela} onSair=${sair}>${tela}<//>`;
}

ReactDOM.createRoot(document.getElementById("app")).render(html`<${App} />`);
</script>
